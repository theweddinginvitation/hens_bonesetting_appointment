<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hen's Bone Setting – Buat Janji Temu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon:#800020; --maroon-deep:#5a0016; --maroon-soft:#f6e6ea;
    --green:#1c7f4b; --green-deep:#14613a;
    --paper:#f4f3f5; --surface:#fff; --ink:#22141a; --muted:#6f6168; --line:#e4dfe2;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); line-height:1.45; }
  button, input { font:inherit; }
  :focus-visible { outline:3px solid #e8a0b2; outline-offset:2px; }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px; }

  /* hero: brand, title, week strip */
  .hero { background:var(--maroon); color:#fff; padding:26px 0 22px; border-radius:0 0 28px 28px; }
  .hero .brand { margin:0 0 14px; color:#fff; font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.005em; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,.22); }
  .hero h1 { margin:0 0 20px; font-family:var(--display); font-weight:800; font-size:clamp(30px,7vw,42px); line-height:1.05; letter-spacing:-.02em; }
  #days { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x proximity; padding:5px 4px 8px; margin:0 -4px; scrollbar-width:none; }
  #days::-webkit-scrollbar { display:none; }
  .day { flex:0 0 70px; min-height:72px; scroll-snap-align:start; border:0; border-radius:14px; padding:9px 4px; background:#cfeedd; color:#0f4a2a; cursor:pointer; text-align:center; transition:filter .15s, transform .15s, box-shadow .15s; }
  .day:hover { filter:brightness(1.07); }
  .day .dn, .day .dc { display:block; font-size:11.5px; font-weight:600; opacity:.9; }
  .day .dd { display:block; font-family:var(--display); font-weight:800; font-size:26px; line-height:1.1; margin:1px 0 2px; }
  .day.ok   { background:#cfeedd; color:#0f4a2a; }
  .day.low  { background:#fde9b8; color:#5c3a00; }
  .day.none { background:#f3d9df; color:var(--maroon); }
  .day[aria-pressed="true"] { transform:translateY(-2px); box-shadow:0 0 0 3px #fff; }

  /* time cards */
  main { padding:24px 0 40px; }
  .head { padding-top:8px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .head h2 { margin:0; font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:-.01em; }
  .head span { color:var(--muted); font-size:14px; font-weight:500; }
  .legend { display:flex; gap:18px; font-size:13px; color:var(--muted); margin:0 0 16px; }
  .legend i { display:inline-block; width:14px; height:14px; border-radius:5px; margin-right:6px; vertical-align:-2px; }
  .legend .l-free { background:var(--green); }
  .legend .l-taken { background:var(--maroon); }

  #slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .slot { border:0; border-radius:16px; padding:13px 14px 15px; text-align:left; color:#fff; min-height:82px; display:flex; flex-direction:column; justify-content:space-between; gap:14px; }
  .slot small { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; opacity:.95; }
  .slot small::before { content:""; width:8px; height:8px; border-radius:50%; background:#fff; }
  .slot.taken small::before { background:transparent; border:1.5px solid rgba(255,255,255,.8); }
  .slot b { font-family:var(--display); font-size:19px; font-weight:700; line-height:1; letter-spacing:-.01em; white-space:nowrap; }
  .slot.free { background:var(--green); cursor:pointer; transition:transform .12s, box-shadow .12s, background .12s; }
  .slot.free:hover { background:var(--green-deep); transform:translateY(-2px); box-shadow:0 8px 18px rgba(28,127,75,.28); }
  .slot.free:active { transform:translateY(0); }
  .slot.taken { background:var(--maroon); cursor:not-allowed;
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px); }
  .slot.taken b { opacity:.85; }

  .foot { background:var(--maroon); color:#fff; text-align:center; font-size:13.5px; font-weight:500; padding:20px 16px; border-radius:28px 28px 0 0; }

  .skel { height:82px; border-radius:16px; background:linear-gradient(90deg,#e9e5e8,#f3f1f3,#e9e5e8); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .note { grid-column:1/-1; text-align:center; padding:36px 16px; color:var(--muted); }
  .note button { margin-top:12px; }
  .btn { border:0; border-radius:12px; padding:13px 20px; font-weight:700; font-size:16px; cursor:pointer; }
  .btn.primary { background:var(--maroon); color:#fff; }
  .btn.primary:hover { background:var(--maroon-deep); }
  .btn.primary:disabled { opacity:.6; cursor:wait; }

  /* centered dialog */
  dialog { border:0; padding:0; border-radius:22px; width:min(420px,calc(100% - 32px)); max-height:calc(100% - 32px); overflow:auto; background:var(--surface); color:var(--ink); box-shadow:0 30px 80px rgba(40,0,12,.35); }
  dialog[open] { animation:pop .22s cubic-bezier(.2,.9,.3,1.2); }
  dialog::backdrop { background:rgba(34,10,18,.55); backdrop-filter:blur(3px); animation:fade .2s; }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(8px); } }
  @keyframes fade { from { opacity:0; } }
  .ticket { background:var(--maroon); color:#fff; padding:22px 22px 18px; position:relative; }
  .ticket .when { margin:0; font-size:14px; color:#f0cfd8; font-weight:500; padding-right:40px; }
  .ticket h2 { margin:4px 0 0; font-family:var(--display); font-size:34px; font-weight:800; line-height:1.05; letter-spacing:-.02em; white-space:nowrap; }
  .x { position:absolute; top:12px; right:12px; width:36px; height:36px; border:0; border-radius:50%; background:rgba(255,255,255,.14); color:#fff; font-size:20px; line-height:1; cursor:pointer; }
  .x:hover { background:rgba(255,255,255,.26); }
  form, .done { padding:20px 22px 24px; }
  .field { margin-bottom:14px; }
  label { display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
  input { width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; font-size:16px; background:#fff; color:var(--ink); }
  input:focus { outline:none; border-color:var(--maroon); box-shadow:0 0 0 4px var(--maroon-soft); }
  input[aria-invalid="true"] { border-color:#c0213d; }
  .err { color:#b3001b; font-size:13.5px; margin:6px 0 0; }
  .err:empty { display:none; }
  #formErr { background:#fdecef; border-radius:10px; padding:10px 12px; margin:0 0 14px; }
  form .btn { width:100%; margin-top:4px; }
  .done { text-align:center; }
  .tick { width:64px; height:64px; margin:6px auto 14px; border-radius:50%; background:var(--green); display:grid; place-items:center; }
  .tick svg { width:32px; height:32px; stroke:#fff; stroke-width:3.2; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:30; stroke-dashoffset:30; animation:draw .45s .15s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .done h2 { margin:0 0 8px; font-family:var(--display); font-size:28px; }
  .done p { margin:0 0 4px; }
  .done .sum { font-weight:700; }
  .done .jam { color:var(--muted); font-weight:600; }
  .done .addr { display:inline-block; margin-top:14px; color:var(--maroon); font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  .done .addr:hover { color:var(--maroon-deep); }
  .done .btn { width:100%; margin-top:20px; }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .tick svg { stroke-dashoffset:0; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="brand">Hen's Bone Setting</p>
    <h1>Buat janji temu</h1>
    <div id="days" role="group" aria-label="Pilih hari"></div>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h2 id="dayTitle">&nbsp;</h2>
    <span id="dayCount"></span>
  </div>
  <div class="legend" aria-hidden="true">
    <span><i class="l-free"></i>Tersedia</span>
    <span><i class="l-taken"></i>Tidak tersedia</span>
  </div>
  <div id="slots" aria-live="polite"></div>
</main>

<footer class="foot">Hens Bone Setting, Hub : +62811 2345 678</footer>

<dialog id="dlg" aria-labelledby="dTitle">
  <div id="formView">
    <div class="ticket">
      <button type="button" class="x" id="close" aria-label="Tutup">&times;</button>
      <p class="when" id="dWhen"></p>
      <h2 id="dTitle"></h2>
    </div>
    <form id="form" novalidate>
      <p class="err" id="formErr" role="alert"></p>
      <div class="field">
        <label for="name">Nama</label>
        <input id="name" name="name" autocomplete="name" maxlength="80" placeholder="Nama lengkap Anda" required>
        <p class="err" id="nameErr"></p>
      </div>
      <div class="field">
        <label for="phone">Nomor Telepon</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="+62 812 3456 7890" required>
        <p class="err" id="phoneErr"></p>
      </div>
      <button type="submit" class="btn primary" id="save">Simpan</button>
    </form>
  </div>
  <div id="doneView" class="done" hidden>
    <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Berhasil</h2>
    <p class="sum" id="doneDate"></p>
    <p class="jam" id="doneTime"></p>
    <a class="addr" id="addr" target="_blank" rel="noopener">Klik disini untuk melihat alamat kami</a>
    <button type="button" class="btn primary" id="done">Selesai</button>
  </div>
</dialog>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const dlg = $('#dlg');
const LOCALE = 'id-ID';
let cfg = null, taken = new Set(), selDate = null, picked = null;

function parts(ymd) { return ymd.split('-').map(Number); }
function addDays(ymd, n) { const [y, m, d] = parts(ymd); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function localDate(ymd) { const [y, m, d] = parts(ymd); return new Date(y, m - 1, d); }
function endTime(t, mins) {
  const [h, m] = t.split(':').map(Number), x = h * 60 + m + mins;
  return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
}
function range(t) { return t + ' - ' + endTime(t, cfg.slotMinutes); }
function fmt(ymd, opts) { return localDate(ymd).toLocaleDateString(LOCALE, opts); }
function dayLabel(ymd) { return fmt(ymd, { weekday: 'long', day: 'numeric', month: 'long' }); }
function fullDate(ymd) { return fmt(ymd, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function isFree(date, t) { const k = date + ' ' + t; return !taken.has(k) && k > cfg.now; }
function openCount(date) { return cfg.times.filter(t => isFree(date, t)).length; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function addressUrl() {
  if (typeof ADDRESS_URL !== 'undefined' && ADDRESS_URL && !ADDRESS_URL.startsWith('PASTE')) return ADDRESS_URL;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent("Hen's Bone Setting");
}

function showSkeleton() {
  const s = $('#slots'); s.replaceChildren();
  for (let i = 0; i < 8; i++) s.append(el('div', 'skel'));
}
function showNote(msg, retry) {
  const s = $('#slots'); s.replaceChildren();
  const n = el('div', 'note', msg);
  if (retry) { const b = el('button', 'btn primary', 'Coba lagi'); b.type = 'button'; b.onclick = () => { showSkeleton(); load(); }; n.append(document.createElement('br'), b); }
  s.append(n);
}

async function load() {
  if (!API_URL || API_URL.startsWith('PASTE')) { showNote('Isi API_URL di config.js terlebih dahulu.'); return; }
  try {
    const r = await fetch(API_URL + '?action=slots');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    cfg = d.config;
    taken = new Set(d.taken.map(t => t.date + ' ' + t.time));
    if (!selDate || selDate < cfg.today) selDate = cfg.today;
    render();
  } catch (e) {
    if (!cfg) showNote('Jadwal gagal dimuat. Periksa koneksi internet Anda.', true);
  }
}

function render() {
  const days = $('#days'); days.replaceChildren();
  for (let i = 0; i < cfg.days; i++) {
    const ymd = addDays(cfg.today, i), n = openCount(ymd);
    const b = el('button', 'day ' + (n === 0 ? 'none' : n <= 2 ? 'low' : 'ok'));
    b.type = 'button';
    b.setAttribute('aria-pressed', ymd === selDate);
    b.setAttribute('aria-label', fullDate(ymd) + ', ' + n + ' jam tersedia');
    b.append(el('span', 'dn', i === 0 ? 'Hari ini' : fmt(ymd, { weekday: 'short' })),
             el('span', 'dd', localDate(ymd).getDate()),
             el('span', 'dc', n ? n + ' kosong' : 'Penuh'));
    b.onclick = () => { selDate = ymd; render(); };
    days.append(b);
  }
  $('#dayTitle').textContent = fullDate(selDate);
  const n = openCount(selDate);
  $('#dayCount').textContent = n ? n + ' dari ' + cfg.times.length + ' jam tersedia' : 'Semua jam sudah terisi';

  const list = $('#slots'); list.replaceChildren();
  cfg.times.forEach(t => {
    const free = isFree(selDate, t);
    const b = el('button', 'slot ' + (free ? 'free' : 'taken'));
    b.type = 'button';
    b.disabled = !free;
    b.append(el('small', null, free ? 'Tersedia' : 'Tidak tersedia'), el('b', null, range(t)));
    b.setAttribute('aria-label', range(t) + (free ? ', tersedia' : ', tidak tersedia'));
    if (free) b.onclick = () => openDialog(selDate, t);
    list.append(b);
  });
}

/* ---- dialog ---- */
function setErr(id, msg) {
  $('#' + id).textContent = msg || '';
  const input = { nameErr: '#name', phoneErr: '#phone' }[id];
  if (input) $(input).setAttribute('aria-invalid', msg ? 'true' : 'false');
}
function openDialog(date, time) {
  picked = { date, time };
  $('#dWhen').textContent = fullDate(date);
  $('#dTitle').textContent = range(time);
  $('#form').reset();
  ['nameErr', 'phoneErr', 'formErr'].forEach(i => setErr(i, ''));
  $('#formView').hidden = false; $('#doneView').hidden = true;
  $('#save').disabled = false; $('#save').textContent = 'Simpan';
  dlg.showModal();
  $('#name').focus();
}
function closeDialog() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { picked = null; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); }); // backdrop
$('#close').onclick = closeDialog;
$('#done').onclick = closeDialog;

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!picked) return;
  const name = $('#name').value.trim(), phone = $('#phone').value.trim();
  setErr('formErr', '');
  const nameBad = name.length < 2 ? 'Masukkan nama Anda.' : '';
  const phoneBad = /^[0-9+\-\s()]{7,20}$/.test(phone) ? '' : 'Masukkan nomor telepon yang valid, contoh +62 812 3456 7890.';
  setErr('nameErr', nameBad); setErr('phoneErr', phoneBad);
  if (nameBad) return $('#name').focus();
  if (phoneBad) return $('#phone').focus();

  const save = $('#save'); save.disabled = true; save.textContent = 'Menyimpan…';
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'book', date: picked.date, time: picked.time, name, phone })
    });
    const d = await r.json();
    if (!d.ok) {
      const gone = /taken|past/i.test(d.error || '');
      setErr('formErr', gone ? 'Maaf, jam ini sudah tidak tersedia. Silakan pilih jam lain.' : 'Gagal menyimpan. Silakan coba lagi.');
      save.disabled = false; save.textContent = 'Simpan';
      await load();
      if (gone) setTimeout(closeDialog, 2200);
      return;
    }
    $('#doneDate').textContent = fullDate(picked.date);
    $('#doneTime').textContent = 'Pukul: ' + range(picked.time);
    $('#addr').href = addressUrl();
    $('#formView').hidden = true; $('#doneView').hidden = false;
    $('#done').focus();
    load();
  } catch (err) {
    setErr('formErr', 'Tidak ada koneksi. Periksa internet Anda lalu tekan Simpan lagi.');
    save.disabled = false; save.textContent = 'Simpan';
  }
});

showSkeleton();
load();
setInterval(() => { if (!dlg.open) load(); }, 30000);
</script>
</body>
</html>
