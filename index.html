<!doctype html>
<html lang="id">

<title>Hen's Bone Setting – Reservasi Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(60,60,67,.16);
    --blue:#007aff; --blue-deep:#0062d6; --blue-soft:rgba(0,122,255,.12);
    --ok:#34c759;
    --paper:#f2f2f7; --surface:#fff; --chip:rgba(120,120,128,.12);
    --ring:0 0 0 .5px rgba(0,0,0,.08);
    --lift:0 12px 32px rgba(0,0,0,.14);

    --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
    /* iOS sheet curve, and a light spring (about 4% overshoot) */
    --ease:cubic-bezier(.32,.72,0,1);
    --spring:cubic-bezier(.34,1.3,.64,1);
  }
  @supports (transition-timing-function:linear(0,1)) {
    :root { --spring:linear(0,.0029,.0116 2%,.0463 4.1%,.105 6.2%,.2437 9.5%,.4663 13.9%,.6692 18.1%,.8329 22.5%,.9381 27.2%,1.0022 32.6%,1.0313 38.4%,1.0376 44.4%,1.0266 52.3%,1.0085 62.4%,1.0006 72%,.998 84%,1); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; scrollbar-gutter:stable; }
  html:has(dialog[open]) { overflow:hidden; }               /* no page scroll behind a dialog */
  body { margin:0; min-height:100vh; min-height:100dvh; font-family:var(--body); background-color:var(--paper); color:var(--ink); line-height:1.4; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; font-optical-sizing:auto;
    /* painted once with the page: no fixed layer to repaint while scrolling on a phone */
    background-image:
      radial-gradient(60% 340px at 10% 0, rgba(0,122,255,.14), transparent 70%),
      radial-gradient(50% 320px at 100% 460px, rgba(175,130,255,.09), transparent 70%);
    background-repeat:no-repeat; }
  button, input { font:inherit; }
  button { touch-action:manipulation; }
  :focus-visible { outline:3px solid rgba(0,122,255,.55); outline-offset:2px; }
  .wrap { max-width:720px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }

  /* header: brand only, translucent bar that floats above scrolling content */
  .hero { position:sticky; top:0; z-index:30; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px); box-shadow:0 .5px 0 var(--line); padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px; animation:barIn .7s var(--ease) backwards; }
  @keyframes barIn { from { transform:translateY(-100%); opacity:0; } }
  .hero .brand { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0; font-family:var(--display); font-weight:600; font-size:17px; letter-spacing:-.022em; }
  .bl { display:inline-flex; align-items:center; gap:10px; min-width:0; }
  .bn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logo { flex:none; width:32px; height:32px; border-radius:10px; background:linear-gradient(180deg,#4da3ff,#007aff); color:#fff; display:grid; place-items:center; box-shadow:inset 0 .5px 0 rgba(255,255,255,.5), 0 2px 6px rgba(0,122,255,.35); }
  .logo svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .cta { flex:none; background:var(--blue); color:#fff; text-decoration:none; font-family:var(--body); font-weight:600; font-size:14px; letter-spacing:-.01em; padding:8px 16px; border-radius:999px; transition:background .2s, transform .5s var(--spring); }
  .cta:hover { background:var(--blue-deep); }
  .cta:active { transform:scale(.94); transition-duration:.1s; }

  /* carousel: directly under the header */
  .ctitle, .reserve h1 { margin:0; font-family:var(--display); font-weight:700; font-size:clamp(28px,7.5vw,34px); line-height:1.12; letter-spacing:-.024em; color:var(--ink); }
  .ctitle { margin:20px 0 12px; animation:rise .8s var(--ease) .05s backwards; }
  .carousel { position:relative; isolation:isolate; margin-top:8px; border-radius:26px; overflow:hidden; aspect-ratio:16/9; background:#e5e5ea; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 14px 34px rgba(0,0,0,.12); animation:rise .9s var(--ease) .12s backwards; }
  @media (min-width:640px) { .carousel { aspect-ratio:21/9; } }
  .carousel.loading { background:linear-gradient(90deg,#e8e8ed,#f5f5f7,#e8e8ed); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  .track { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .track::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 100%; height:100%; scroll-snap-align:center; scroll-snap-stop:always; cursor:zoom-in; background:#e5e5ea; overflow:hidden; }
  .slide img { width:100%; height:100%; object-fit:cover; display:block; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; transition:transform .7s var(--ease); }
  .slide:active img { transform:scale(1.03); transition-duration:.25s; }
  .cdots { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:6px; padding:7px 10px; border-radius:20px; background:rgba(0,0,0,.28); -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%); }
  .cdots button { width:7px; height:7px; padding:0; border:0; border-radius:4px; background:rgba(255,255,255,.6); transition:width .55s var(--spring), background .25s; }
  .cdots button[aria-current="true"] { width:20px; background:#fff; }
  .cbtn { display:none; position:absolute; top:50%; width:40px; height:40px; margin-top:-20px; border:0; border-radius:50%; background:rgba(255,255,255,.7); -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%); box-shadow:0 2px 10px rgba(0,0,0,.16), inset 0 .5px 0 rgba(255,255,255,.8); color:var(--ink); font-size:22px; line-height:1; place-items:center; cursor:pointer; transition:background .2s, transform .5s var(--spring); }

  #days::-webkit-scrollbar { display:none; }
  .day { flex:0 0 66px; min-height:78px; scroll-snap-align:start; border:0; border-radius:20px; padding:10px 4px; background:var(--surface); color:var(--ink); cursor:pointer; text-align:center; box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.05); transition:transform .55s var(--spring), box-shadow .3s var(--ease), background .3s var(--ease), color .3s var(--ease); }
  .day .dn, .day .dc { display:block; font-size:11.5px; font-weight:600; letter-spacing:-.005em; }
  .day .dn { color:var(--muted); }
  .day .dd { display:block; font-family:var(--display); font-weight:700; font-size:24px; line-height:1.1; margin:1px 0 2px; letter-spacing:-.025em; }
  .day.ok   .dc { color:var(--blue); }
  .day.low  { background:#fff6e5; } .day.low .dc { color:#b36200; }

  .day:active { transform:scale(.94); transition-duration:.1s; }

  .day[aria-pressed="true"] .dn, .day[aria-pressed="true"] .dc { color:rgba(255,255,255,.88); }
  @media (hover:hover) { .day:not([aria-pressed="true"]):hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.1); } }

  /* time cards */
  main.wrap { padding-top:8px; padding-bottom:20px; }
  .head { padding-top:6px; display:flex; align-items:baseline; justify-content:space-between; gap:4px 12px; flex-wrap:wrap; margin-bottom:8px; }
  .head h2 { margin:0; font-family:var(--display); font-size:21px; font-weight:700; letter-spacing:-.022em; }
  .head span { color:var(--muted); font-size:14px; font-weight:500; }
  .legend { display:flex; gap:18px; font-size:13px; color:var(--muted); margin:0 0 16px; }
  .legend i { display:inline-block; width:14px; height:14px; border-radius:5px; margin-right:6px; vertical-align:-2px; }
  .legend .l-free { background:#fff; border:1.5px solid var(--blue); }
  .legend .l-taken { background:rgba(120,120,128,.16); }

  #slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; min-height:276px; align-content:start; }
  .slot { border:0; border-radius:20px; padding:14px 15px 16px; text-align:left; min-height:84px; display:flex; flex-direction:column; justify-content:space-between; gap:14px; box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.05); }
  .slot.in { animation:slotIn .7s var(--ease) backwards; animation-delay:calc(var(--i, 0) * 38ms); }
  @keyframes slotIn { from { opacity:0; transform:translate3d(0,18px,0) scale(.96); } }
  .slot small { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; letter-spacing:-.005em; }
  .slot small::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
  .slot.taken small::before { background:transparent; border:1.5px solid currentColor; }
  .slot b { font-family:var(--display); font-size:18px; font-weight:700; line-height:1; letter-spacing:-.022em; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .slot.free { background:var(--surface); color:var(--blue); cursor:pointer; transition:transform .55s var(--spring), box-shadow .3s var(--ease), background .2s, color .2s; }
  @media (hover:hover) { .slot.free:hover { background:var(--blue); color:#fff; transform:translate3d(0,-3px,0); box-shadow:0 12px 26px rgba(0,122,255,.34); } }
  .slot.free:active { transform:scale(.95); background:var(--blue); color:#fff; transition-duration:.1s; }
  .slot.taken { background:rgba(120,120,128,.1); box-shadow:none; color:#9a9aa1; cursor:not-allowed; }

  .foot { background:transparent; color:var(--muted); text-align:center; font-size:13px; font-weight:500; padding:22px 16px calc(26px + env(safe-area-inset-bottom,0px)); box-shadow:inset 0 .5px 0 var(--line); }

  .skel { height:84px; border-radius:20px; background:linear-gradient(90deg,#e8e8ed,#f5f5f7,#e8e8ed); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  @keyframes rise { from { opacity:0; transform:translate3d(0,14px,0); } }
  .note { grid-column:1/-1; text-align:center; padding:36px 16px; color:var(--muted); }
  .note button { margin-top:12px; }
  .btn { border:0; border-radius:14px; padding:15px 20px; font-weight:600; font-size:17px; letter-spacing:-.015em; cursor:pointer; transition:transform .5s var(--spring), background .2s, opacity .2s; }
  .btn:active { transform:scale(.97); transition-duration:.1s; }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.primary:hover { background:var(--blue-deep); }
  .btn.primary:disabled { opacity:.6; cursor:wait; }
  .btn.ghost { background:var(--chip); color:var(--blue); }
  .btn.ghost:hover { background:rgba(120,120,128,.2); }

  /* dialogs: glass sheets. Rise from the bottom on phones, spring in at the centre on wide screens. */
  dialog { border:0; padding:0; border-radius:28px; width:min(420px,calc(100% - 32px)); max-height:calc(100% - 32px); max-height:calc(100dvh - 32px); overflow:auto; overscroll-behavior:contain; background:rgba(250,250,252,.92); -webkit-backdrop-filter:saturate(180%) blur(30px); backdrop-filter:saturate(180%) blur(30px); color:var(--ink); box-shadow:0 0 0 .5px rgba(0,0,0,.1), 0 30px 80px rgba(0,0,0,.3);
    opacity:0; transform:translateY(18px) scale(.95);
    transition:opacity .3s var(--ease), transform .6s var(--spring), overlay .6s allow-discrete, display .6s allow-discrete; }
  dialog[open] { opacity:1; transform:none; }
  @starting-style { dialog[open] { opacity:0; transform:translateY(18px) scale(.95); } }
  dialog::backdrop { background:rgba(0,0,0,0); -webkit-backdrop-filter:blur(0); backdrop-filter:blur(0); transition:background .45s var(--ease), backdrop-filter .45s var(--ease), overlay .45s allow-discrete, display .45s allow-discrete; }
  dialog[open]::backdrop { background:rgba(0,0,0,.32); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  @starting-style { dialog[open]::backdrop { background:rgba(0,0,0,0); -webkit-backdrop-filter:blur(0); backdrop-filter:blur(0); } }
  @supports not (transition-behavior:allow-discrete) {
    dialog[open] { animation:pop .45s var(--spring); }
    dialog[open]::backdrop { animation:fade .3s; }
  }
  @keyframes pop { from { opacity:0; transform:translateY(18px) scale(.95); } }
  @keyframes fade { from { opacity:0; } }
  @media (max-width:639px) {
    dialog#dlg { width:100%; max-width:none; margin:auto 0 0; border-radius:30px 30px 0 0; max-height:92dvh; padding-bottom:env(safe-area-inset-bottom,0px); transform:translateY(100%); transition:opacity .25s var(--ease), transform .55s var(--ease), overlay .55s allow-discrete, display .55s allow-discrete; }
    dialog#dlg[open] { transform:none; }
  }
  @media (max-width:639px) { @starting-style { dialog#dlg[open] { opacity:1; transform:translateY(100%); } } }
  .ticket { background:transparent; color:var(--ink); padding:22px 22px 4px; position:relative; }
  @media (max-width:639px) { .ticket::before { content:""; position:absolute; top:8px; left:50%; width:38px; height:5px; margin-left:-19px; border-radius:3px; background:rgba(60,60,67,.3); } .ticket { padding-top:28px; } }
  .ticket .when { margin:0; font-size:14px; color:var(--muted); font-weight:500; padding-right:44px; }
  .ticket h2 { margin:2px 0 0; font-family:var(--display); font-size:30px; font-weight:700; line-height:1.1; letter-spacing:-.026em; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .x { position:absolute; top:14px; right:14px; width:32px; height:32px; border:0; border-radius:50%; background:rgba(120,120,128,.16); color:var(--muted); font-size:20px; line-height:1; cursor:pointer; display:grid; place-items:center; transition:background .2s, transform .5s var(--spring); }
  .x::after { content:""; position:absolute; inset:-6px; }       /* 44px touch target around the 32px button */
  .x:hover { background:rgba(120,120,128,.28); }
  .x:active { transform:scale(.88); transition-duration:.1s; }
  form, .done { padding:18px 22px 24px; }
  .field { margin-bottom:14px; }
  label { display:block; font-weight:600; font-size:13px; color:var(--muted); margin:0 0 6px 4px; letter-spacing:-.005em; }
  input { width:100%; padding:14px 16px; border:0; border-radius:14px; font-size:17px; letter-spacing:-.015em; background:rgba(120,120,128,.12); color:var(--ink); transition:background .2s, box-shadow .3s var(--ease); }
  input::placeholder { color:#9a9aa1; }
  input:focus { outline:none; background:#fff; box-shadow:0 0 0 3.5px rgba(0,122,255,.4); }
  input[aria-invalid="true"] { box-shadow:0 0 0 2px #ff3b30; background:#fff; }
  .err { color:#d1322b; font-size:13px; margin:6px 0 0 4px; }
  .err:empty { display:none; }
  #formErr { background:#fdeeed; border-radius:12px; padding:10px 12px; margin:0 0 14px; }
  form .btn { width:100%; margin-top:6px; }
  .dupbox { padding:26px 22px 22px; text-align:center; }
  .dupbox h2 { margin:0 0 8px; font-family:var(--display); font-size:20px; font-weight:700; letter-spacing:-.022em; }
  .dupbox p { margin:0 0 20px; color:var(--muted); font-size:15px; }
  .dupbtns { display:flex; gap:10px; }
  .dupbtns .btn { flex:1; padding:13px 10px; font-size:16px; }
  .done { text-align:center; }
  .tick { width:68px; height:68px; margin:8px auto 16px; border-radius:50%; background:var(--ok); display:grid; place-items:center; box-shadow:0 10px 24px rgba(52,199,89,.38); animation:tickPop .75s var(--spring) backwards; }
  @keyframes tickPop { from { transform:scale(.3); opacity:0; } }
  .tick svg { width:34px; height:34px; stroke:#fff; stroke-width:3.2; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:30; stroke-dashoffset:30; animation:draw .5s .25s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .done h2 { margin:0 0 8px; font-family:var(--display); font-size:28px; font-weight:700; letter-spacing:-.025em; }
  .done p { margin:0 0 4px; }
  .done .sum { font-weight:600; }
  .done .jam { color:var(--muted); font-weight:500; }
  .done .addr { display:inline-block; margin-top:14px; padding:6px 0; color:var(--blue); font-weight:500; text-decoration:none; }
  .done .addr:hover { text-decoration:underline; text-underline-offset:3px; }
  .done .btn { width:100%; margin-top:20px; }
  .done .btn + .btn { margin-top:10px; }

  /* photo viewer */
  dialog#lb { width:100%; height:100%; height:100dvh; max-width:none; max-height:none; margin:0; border:0; border-radius:0; padding:0; overflow:hidden; background:rgba(0,0,0,.94); -webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px); color:#fff; box-shadow:none; transform:scale(1.04); transition:opacity .35s var(--ease), transform .55s var(--ease), overlay .55s allow-discrete, display .55s allow-discrete; }
  dialog#lb[open] { transform:none; }
  @starting-style { dialog#lb[open] { opacity:0; transform:scale(1.04); } }
  @supports not (transition-behavior:allow-discrete) { dialog#lb[open] { animation:fade .25s ease; } }
  .lbbar { position:absolute; top:0; left:0; right:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:calc(12px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 12px calc(14px + env(safe-area-inset-left,0px)); pointer-events:none; }
  .lbbar span { background:rgba(255,255,255,.16); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-radius:20px; padding:6px 13px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .lbbar button { pointer-events:auto; width:44px; height:44px; border:0; border-radius:50%; background:rgba(255,255,255,.16); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); color:#fff; font-size:17px; cursor:pointer; transition:background .2s, transform .5s var(--spring); }
  .lbbar button:active { transform:scale(.9); transition-duration:.1s; }
  .lbtrack { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .lbtrack::-webkit-scrollbar { display:none; }
  dialog#lb.zoomed .lbtrack { overflow-x:hidden; scroll-snap-type:none; }
  .lbslide { flex:0 0 100%; height:100%; display:flex; overflow:hidden; scroll-snap-align:center; scroll-snap-stop:always; padding:64px 0 calc(24px + env(safe-area-inset-bottom,0px)); box-sizing:border-box; }
  .lbslide img { max-width:100%; max-height:100%; margin:auto; object-fit:contain; cursor:zoom-in; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; border-radius:6px; }
  .lbslide.zoomed { display:block; overflow:auto; padding:0; -webkit-overflow-scrolling:touch; }
  .lbslide.zoomed img { max-width:none; max-height:none; width:240%; height:auto; margin:0; display:block; cursor:zoom-out; border-radius:0; }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .tick svg { stroke-dashoffset:0; }
  }
  @media (prefers-reduced-transparency:reduce) {
    .hero, dialog, .cdots, .cbtn { -webkit-backdrop-filter:none; backdrop-filter:none; }
    .hero, dialog { background:#fff; }
  }
</style>
</head>
<body>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const dlg = $('#dlg'), dup = $('#dup'), lb = $('#lb'), lbTrack = $('#lbTrack');
const LOCALE = 'id-ID';
const canHover = matchMedia('(hover:hover)').matches;     // phones: no auto-focus, so the keyboard does not fight the dialog
let cfg = null, taken = new Set(), selDate = null, picked = null;

// 0812 3456 7890 -> +6281234567890 ; 62812... -> +62812... ; 0062... -> +62...
function normPhone(p) {
  let d = String(p).trim();
  if (d.startsWith('+')) { d = d.slice(1).replace(/\D/g, ''); if (d.startsWith('0')) d = '62' + d.slice(1); return '+' + d; }
  d = d.replace(/\D/g, '');
  if (d.startsWith('00')) return '+' + d.slice(2);
  if (d.startsWith('0')) return '+62' + d.slice(1);
  if (d.startsWith('62')) return '+' + d;
  return d;
}
function parts(ymd) { return ymd.split('-').map(Number); }
function addDays(ymd, n) { const [y, m, d] = parts(ymd); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function localDate(ymd) { const [y, m, d] = parts(ymd); return new Date(y, m - 1, d); }
function endTime(t, mins) {
  const [h, m] = t.split(':').map(Number), x = h * 60 + m + mins;
  return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
}
function range(t) { return t + ' - ' + endTime(t, cfg.slotMinutes); }
function fmt(ymd, opts) { return localDate(ymd).toLocaleDateString(LOCALE, opts); }
function fullDate(ymd) { return fmt(ymd, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function isFree(date, t) { const k = date + ' ' + t; return !taken.has(k) && k > cfg.now; }
function openCount(date) { return cfg.times.filter(t => isFree(date, t)).length; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function addressUrl() {
  if (typeof ADDRESS_URL !== 'undefined' && ADDRESS_URL && !ADDRESS_URL.startsWith('PASTE')) return ADDRESS_URL;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent("Hen's Bone Setting");
}

/* ---- existing appointment (this device) ---- */
const STORE = 'hbs_booking';
function saveMine(b) { try { localStorage.setItem(STORE, JSON.stringify(b)); } catch (e) {} }
function getMine() {
  try {
    const b = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (b && b.date && b.time && (b.date + ' ' + b.time) > cfg.now) return b;
  } catch (e) {}
  return null;
}
let pending = null;
function askChange(date, time) {
  const m = getMine();
  pending = { date, time, old: m };
  $('#dupMsg').textContent = 'Anda sudah memiliki janji temu pada ' + fullDate(m.date) + ', pukul ' + range(m.time) + '. Ingin mengubah waktu janji temu?';
  dup.showModal();
}
function closeDup() { if (dup.open) dup.close(); }
dup.addEventListener('click', e => { if (e.target === dup) closeDup(); });
$('#dupNo').onclick = closeDup;
$('#dupYes').onclick = () => {
  const p = pending; closeDup();
  if (p) openDialog(p.date, p.time, p.old);
};

/* ---- schedule: built once, then updated in place (no flicker, no lost taps, no scroll reset) ---- */
let dayEls = [], slotEls = [], daysKey = null, timesKey = null, lastSig = null, shownDay = null;

function showSkeleton() {
  const s = $('#slots'); s.replaceChildren(); slotEls = []; timesKey = null;
  for (let i = 0; i < 8; i++) s.append(el('div', 'skel'));
}
function showNote(msg, retry) {
  const s = $('#slots'); s.replaceChildren(); slotEls = []; timesKey = null;
  const n = el('div', 'note', msg);
  if (retry) { const b = el('button', 'btn primary', 'Coba lagi'); b.type = 'button'; b.onclick = () => { showSkeleton(); load(); }; n.append(document.createElement('br'), b); }
  s.append(n);
}

async function load() {
  if (!API_URL || API_URL.startsWith('PASTE')) { showNote('Isi API_URL di config.js terlebih dahulu.'); return; }
  try {
    const r = await fetch(API_URL + '?action=slots');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    cfg = d.config;
    taken = new Set(d.taken.map(t => t.date + ' ' + t.time));
    if (!selDate || selDate < cfg.today) selDate = cfg.today;
    render();
  } catch (e) {
    if (!cfg) showNote('Jadwal gagal dimuat. Periksa koneksi internet Anda.', true);
  }
}

function buildDays() {
  const strip = $('#days'); strip.replaceChildren(); dayEls = [];
  for (let i = 0; i < cfg.days; i++) {
    const ymd = addDays(cfg.today, i);
    const b = el('button', 'day'), c = el('span', 'dc');
    b.type = 'button';
    b.append(el('span', 'dn', i === 0 ? 'Hari ini' : fmt(ymd, { weekday: 'short' })), el('span', 'dd', localDate(ymd).getDate()), c);
    b.onclick = () => {
      if (selDate === ymd) return;
      selDate = ymd; render();
      strip.scrollTo({ left: b.offsetLeft - (strip.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
    };
    strip.append(b); dayEls.push({ b, c, ymd });
  }
  daysKey = cfg.today + '|' + cfg.days;
}
function buildSlots() {
  const list = $('#slots'); list.replaceChildren(); slotEls = [];
  cfg.times.forEach(t => {
    const b = el('button', 'slot'), s = el('small');
    b.type = 'button';
    b.append(s, el('b', null, range(t)));
    b.onclick = () => { if (!isFree(selDate, t)) return; getMine() ? askChange(selDate, t) : openDialog(selDate, t); };
    list.append(b); slotEls.push({ b, s, t });
  });
  timesKey = cfg.times.join() + '|' + cfg.slotMinutes;
}
function animateSlots() {
  slotEls.forEach(x => x.b.classList.remove('in'));
  void $('#slots').offsetWidth;                            // one reflow restarts every animation together
  slotEls.forEach((x, i) => { x.b.style.setProperty('--i', Math.min(i, 10)); x.b.classList.add('in'); });
}

function render() {
  if (daysKey !== cfg.today + '|' + cfg.days) buildDays();
  if (timesKey !== cfg.times.join() + '|' + cfg.slotMinutes) { buildSlots(); lastSig = null; shownDay = null; }
  const counts = dayEls.map(d => openCount(d.ymd));
  const flags = cfg.times.map(t => isFree(selDate, t) ? 1 : 0).join('');
  const sig = selDate + '|' + counts.join() + '|' + flags;
  if (sig === lastSig) return;                             // nothing changed: touch nothing
  lastSig = sig;

  dayEls.forEach((d, i) => {
    const n = counts[i];
    d.b.className = 'day ' + (n === 0 ? 'none' : n <= 2 ? 'low' : 'ok');
    d.b.setAttribute('aria-pressed', d.ymd === selDate);
    d.b.setAttribute('aria-label', fullDate(d.ymd) + ', ' + n + ' jam tersedia');
    d.c.textContent = n ? n + ' kosong' : 'Penuh';
  });
  const n = counts[dayEls.findIndex(d => d.ymd === selDate)];
  $('#dayTitle').textContent = fullDate(selDate);
  $('#dayCount').textContent = n ? n + ' dari ' + cfg.times.length + ' jam tersedia' : 'Semua jam sudah terisi';

  slotEls.forEach(x => {
    const free = isFree(selDate, x.t);
    x.b.classList.toggle('free', free); x.b.classList.toggle('taken', !free);
    x.b.disabled = !free;
    x.s.textContent = free ? 'Tersedia' : 'Tidak tersedia';
    x.b.setAttribute('aria-label', range(x.t) + (free ? ', tersedia' : ', tidak tersedia'));
  });
  if (shownDay !== selDate) { shownDay = selDate; animateSlots(); }
}

/* ---- booking dialog ---- */
function setErr(id, msg) {
  $('#' + id).textContent = msg || '';
  const input = { nameErr: '#name', phoneErr: '#phone' }[id];
  if (input) $(input).setAttribute('aria-invalid', msg ? 'true' : 'false');
}
function openDialog(date, time, old) {
  picked = { date, time, old: old || null };
  $('#dWhen').textContent = fullDate(date);
  $('#dTitle').textContent = range(time);
  $('#form').reset();
  if (old && old.name) { $('#name').value = old.name; $('#phone').value = old.phone || ''; }
  ['nameErr', 'phoneErr', 'formErr'].forEach(i => setErr(i, ''));
  $('#formView').hidden = false; $('#doneView').hidden = true;
  $('#save').disabled = false; $('#save').textContent = 'Simpan';
  dlg.showModal();
  if (canHover) $('#name').focus(); else $('#close').blur();
}
function closeDialog() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { picked = null; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); }); // backdrop
$('#close').onclick = closeDialog;
$('#done').onclick = closeDialog;

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!picked) return;
  const name = $('#name').value.trim(), phoneRaw = $('#phone').value.trim();
  setErr('formErr', '');
  const nameBad = name.length < 2 ? 'Masukkan nama Anda.' : '';
  const phoneBad = /^[0-9+\-\s()]{7,20}$/.test(phoneRaw) ? '' : 'Masukkan nomor telepon yang valid, contoh +62 812 3456 7890.';
  setErr('nameErr', nameBad); setErr('phoneErr', phoneBad);
  if (nameBad) return $('#name').focus();
  if (phoneBad) return $('#phone').focus();
  const phone = normPhone(phoneRaw);

  const save = $('#save'); save.disabled = true; save.textContent = 'Menyimpan…';
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(picked.old
        ? { action: 'reschedule', oldDate: picked.old.date, oldTime: picked.old.time, date: picked.date, time: picked.time, name, phone }
        : { action: 'book', date: picked.date, time: picked.time, name, phone })
    });
    const d = await r.json();
    if (!d.ok) {
      if (/duplicate|already|exist/i.test(d.error || '') && d.existing && !picked.old) {
        saveMine({ date: d.existing.date, time: d.existing.time, name, phone });
        const t = picked;
        await load();
        closeDialog();
        askChange(t.date, t.time);
        return;
      }
      const gone = /taken|past/i.test(d.error || '');
      setErr('formErr', gone ? 'Maaf, jam ini sudah tidak tersedia. Silakan pilih jam lain.' : 'Gagal menyimpan. Silakan coba lagi.');
      save.disabled = false; save.textContent = 'Simpan';
      await load();
      if (gone) setTimeout(closeDialog, 2200);
      return;
    }
    saveMine({ date: picked.date, time: picked.time, name, phone });
    $('#doneDate').textContent = fullDate(picked.date);
    $('#doneTime').textContent = 'Pukul: ' + range(picked.time);
    $('#addr').href = addressUrl();
    const mine = { date: picked.date, time: picked.time };
    $('#ics').onclick = () => downloadIcs(mine.date, mine.time);
    $('#formView').hidden = true; $('#doneView').hidden = false;
    $('#done').focus();
    load();
  } catch (err) {
    setErr('formErr', 'Tidak ada koneksi. Periksa internet Anda lalu tekan Simpan lagi.');
    save.disabled = false; save.textContent = 'Simpan';
  }
});

/* ---- add to calendar (.ics, floating local time) ---- */
function downloadIcs(date, time) {
  const d = date.replace(/-/g, ''), t = x => x.replace(':', '') + '00';
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hens Bone Setting//Reservasi//ID', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT', 'UID:' + d + 'T' + t(time) + '@hens-bone-setting', 'DTSTAMP:' + stamp,
    'DTSTART:' + d + 'T' + t(time), 'DTEND:' + d + 'T' + t(endTime(time, cfg.slotMinutes)),
    "SUMMARY:Janji temu - Hen's Bone Setting",
    'BEGIN:VALARM', 'TRIGGER:-PT1H', 'ACTION:DISPLAY', 'DESCRIPTION:Janji temu 1 jam lagi', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = 'janji-temu.ics';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---- carousel (images are managed from admin.html) ---- */
const CAR = $('#carousel'), carWrap = $('#carWrap');
function setCar(on) { CAR.hidden = !on; carWrap.hidden = !on; }   // "Pengumuman" label follows the carousel; "Reservasi" moves up when it is hidden
function driveUrl(id, w) { return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + w; }
let carPause = 0, lbImages = [], carTimer = 0, carVisible = true;
try { setCar(localStorage.getItem('hbs_car') !== '0'); } catch (e) {}
function rememberCar(on) { try { localStorage.setItem('hbs_car', on ? '1' : '0'); } catch (e) {} }
async function loadCarousel() {
  if (!API_URL || API_URL.startsWith('PASTE')) { setCar(false); return; }
  try {
    const d = await (await fetch(API_URL + '?action=site')).json();
    if (!d.ok) throw new Error(d.error);
    if (d.footer) $('#foot').textContent = d.footer;
    if (!d.carouselEnabled || !d.images.length) { rememberCar(false); setCar(false); return; }
    rememberCar(true); setCar(true);
    lbImages = d.images;
    buildCarousel(d.images);
  } catch (e) { setCar(false); }
}
function buildCarousel(images) {
  clearInterval(carTimer);
  CAR.replaceChildren();
  const track = el('div', 'track'), imgs = [];
  images.forEach((im, i) => {
    const s = el('div', 'slide'), img = document.createElement('img');
    img.src = driveUrl(im.fileId, 1200);                     // sharp on phones, much lighter than 1600
    img.alt = 'Foto ' + (i + 1);
    img.decoding = 'async'; img.draggable = false;
    img.loading = i ? 'lazy' : 'eager';
    if (i) img.setAttribute('fetchpriority', 'low');
    img.onerror = () => { if (!img.dataset.f) { img.dataset.f = 1; img.src = 'https://lh3.googleusercontent.com/d/' + im.fileId + '=w1200'; } };
    s.append(img); s.onclick = () => openLightbox(i); track.append(s); imgs.push(img);
  });
  // first photo first; then fetch the rest so swiping never shows a blank slide
  const warm = () => imgs.slice(1).forEach(x => { x.loading = 'eager'; });
  if (imgs[0].complete) warm(); else imgs[0].addEventListener('load', warm, { once: true });
  CAR.append(track);
  CAR.classList.remove('loading');
  const n = images.length;
  if (n < 2) return;

  const idx = () => Math.round(track.scrollLeft / track.clientWidth);
  const go = i => track.scrollTo({ left: ((i % n) + n) % n * track.clientWidth, behavior: 'smooth' });
  const dots = el('div', 'cdots');
  const dotBtns = images.map((_, i) => { const b = el('button'); b.type = 'button'; b.setAttribute('aria-label', 'Foto ' + (i + 1)); b.onclick = () => { carPause = Date.now() + 8000; go(i); }; dots.append(b); return b; });
  const prev = el('button', 'cbtn prev', '‹'), next = el('button', 'cbtn next', '›');
  prev.type = next.type = 'button'; prev.setAttribute('aria-label', 'Sebelumnya'); next.setAttribute('aria-label', 'Berikutnya');
  prev.onclick = () => { carPause = Date.now() + 8000; go(idx() - 1); };
  next.onclick = () => { carPause = Date.now() + 8000; go(idx() + 1); };
  CAR.append(prev, next, dots);

  let raf = 0, cur = -1;
  const sync = () => { const c = idx(); if (c === cur) return; cur = c; dotBtns.forEach((b, i) => b.setAttribute('aria-current', i === c)); };
  track.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; sync(); }); }, { passive: true });
  ['pointerdown', 'touchstart', 'wheel'].forEach(ev => track.addEventListener(ev, () => { carPause = Date.now() + 8000; }, { passive: true }));
  CAR.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') carPause = Date.now() + 8000; });
  sync();
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { carVisible = es[0].isIntersecting; }, { threshold: .4 }).observe(CAR);
  if (!matchMedia('(prefers-reduced-motion:reduce)').matches) {
    carTimer = setInterval(() => { if (!document.hidden && carVisible && !lb.open && Date.now() > carPause) go(idx() + 1); }, 5000);
  }
}

/* ---- lightbox: swipe between photos, tap a photo to zoom ---- */
function openLightbox(i) {
  lbTrack.replaceChildren(); lb.classList.remove('zoomed');
  lbImages.forEach((im, k) => {
    const s = el('div', 'lbslide'), img = document.createElement('img');
    img.src = driveUrl(im.fileId, 2000); img.alt = 'Foto ' + (k + 1); img.draggable = false; img.decoding = 'async';
    img.onerror = () => { if (!img.dataset.f) { img.dataset.f = 1; img.src = 'https://lh3.googleusercontent.com/d/' + im.fileId + '=w2000'; } };
    s.append(img); s.onclick = e => zoomTap(s, e); lbTrack.append(s);
  });
  carPause = Infinity;
  lb.showModal();
  lbTrack.scrollLeft = i * lbTrack.clientWidth;
  lbCount();
}
function zoomTap(s, e) {
  const img = s.firstChild;
  if (s.classList.contains('zoomed')) { s.classList.remove('zoomed'); lb.classList.remove('zoomed'); s.scrollLeft = 0; s.scrollTop = 0; return; }
  if (e.target !== img) { lb.close(); return; }          // tap on the dark area closes
  const r = img.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  s.classList.add('zoomed'); lb.classList.add('zoomed');
  s.scrollLeft = fx * s.scrollWidth - s.clientWidth / 2;  // keep the tapped spot under the finger
  s.scrollTop = fy * s.scrollHeight - s.clientHeight / 2;
}
let lbRaf = 0;
function lbCount() { $('#lbCount').textContent = (Math.round(lbTrack.scrollLeft / lbTrack.clientWidth) + 1) + ' / ' + lbImages.length; }
lbTrack.addEventListener('scroll', () => { if (!lbRaf) lbRaf = requestAnimationFrame(() => { lbRaf = 0; lbCount(); }); }, { passive: true });
$('#lbX').onclick = () => lb.close();
lb.addEventListener('close', () => { lb.classList.remove('zoomed'); carPause = Date.now() + 8000; });
lb.addEventListener('keydown', e => {
  if (lb.classList.contains('zoomed')) return;
  if (e.key === 'ArrowRight') lbTrack.scrollBy({ left: lbTrack.clientWidth, behavior: 'smooth' });
  if (e.key === 'ArrowLeft') lbTrack.scrollBy({ left: -lbTrack.clientWidth, behavior: 'smooth' });
});

/* ---- auto refresh after 1 minute without tap / scroll / key press ---- */
let lastAct = Date.now();
['pointerdown', 'touchstart', 'scroll', 'wheel', 'keydown'].forEach(ev =>
  window.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true })); // capture: also sees scrolling inside the carousel / day strip
function idleCheck() {
  if (dlg.open || dup.open || lb.open) { lastAct = Date.now(); return; } // never reload while a dialog is open
  if (Date.now() - lastAct >= 60000) location.reload();
}
setInterval(() => { if (!document.hidden) idleCheck(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) idleCheck(); }); // returning to the tab after a long time

showSkeleton();
load();
loadCarousel();
setInterval(() => { if (!dlg.open && !document.hidden) load(); }, 30000);
</script>
</body>
</html>
