<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hen's Bone Setting – Buat Janji Temu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0b3558; --muted:#5b6f86; --line:#e3e7ec;
    --blue:#006bff; --blue-deep:#0052cc; --blue-soft:#eaf2ff;
    --ok:#17a05d;
    --paper:#f7f8fa; --surface:#fff; --chip:#f1f3f6;
    --ring:0 0 0 1px rgba(34,42,53,.08);
    --lift:0 4px 14px rgba(71,103,136,.16);
    --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); line-height:1.45; }
  button, input { font:inherit; }
  :focus-visible { outline:3px solid #3b82f6; outline-offset:2px; }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px; }

  /* header: brand, title, week strip */
  .hero { background:var(--surface); color:var(--ink); padding:22px 0 14px; border-bottom:1px solid var(--line); }
  .hero .brand { margin:0 0 14px; font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:-.01em; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .hero h1 { margin:0 0 18px; font-family:var(--display); font-weight:800; font-size:clamp(28px,6.5vw,38px); line-height:1.1; letter-spacing:-.03em; }
  #days { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x proximity; padding:5px 4px 8px; margin:0 -4px; scrollbar-width:none; }
  #days::-webkit-scrollbar { display:none; }
  .day { flex:0 0 70px; min-height:72px; scroll-snap-align:start; border:0; border-radius:12px; padding:9px 4px; background:#e4f5ec; color:#0b5d37; cursor:pointer; text-align:center; transition:transform .15s, box-shadow .15s, filter .15s; }
  .day:hover { filter:brightness(.97); }
  .day .dn, .day .dc { display:block; font-size:11.5px; font-weight:600; opacity:.85; }
  .day .dd { display:block; font-family:var(--display); font-weight:700; font-size:24px; line-height:1.1; margin:1px 0 2px; letter-spacing:-.02em; }
  .day.ok   { background:#e4f5ec; color:#0b5d37; }
  .day.low  { background:#fff1cc; color:#6b4300; }
  .day.none { background:#fdeaed; color:#a1283b; }
  .day[aria-pressed="true"] { transform:translateY(-2px); box-shadow:0 0 0 2px var(--blue); }

  /* time cards */
  main.wrap { padding-top:24px; padding-bottom:16px; }
  .head { padding-top:8px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .head h2 { margin:0; font-family:var(--display); font-size:20px; font-weight:700; letter-spacing:-.02em; }
  .head span { color:var(--muted); font-size:14px; font-weight:500; }
  .legend { display:flex; gap:18px; font-size:13px; color:var(--muted); margin:0 0 16px; }
  .legend i { display:inline-block; width:14px; height:14px; border-radius:4px; margin-right:6px; vertical-align:-2px; box-sizing:border-box; }
  .legend .l-free { background:#fff; border:1.5px solid var(--blue); }
  .legend .l-taken { background:#e9ecf0; }

  #slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .slot { border:1px solid transparent; border-radius:12px; padding:13px 14px 15px; text-align:left; min-height:82px; display:flex; flex-direction:column; justify-content:space-between; gap:14px; }
  .slot small { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; }
  .slot small::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
  .slot.taken small::before { background:transparent; border:1.5px solid currentColor; }
  .slot b { font-family:var(--display); font-size:18px; font-weight:700; line-height:1; letter-spacing:-.02em; white-space:nowrap; }
  .slot.free { background:var(--surface); color:var(--blue); border-color:var(--blue); cursor:pointer; transition:transform .12s, box-shadow .12s, background .12s, color .12s; }
  .slot.free:hover { background:var(--blue); color:#fff; transform:translateY(-2px); box-shadow:var(--lift); }
  .slot.free:active { transform:translateY(0); }
  .slot.taken { background:#eceff3; color:#98a4b3; cursor:not-allowed; }

  .foot { background:var(--ink); color:#cbd7e5; text-align:center; font-size:13.5px; font-weight:500; padding:20px 16px; }

  .skel { height:82px; border-radius:12px; background:linear-gradient(90deg,#eceff3,#f6f7f9,#eceff3); background-size:200% 100%; animation:sh 1.2s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .note { grid-column:1/-1; text-align:center; padding:36px 16px; color:var(--muted); }
  .note button { margin-top:12px; }
  .btn { border:0; border-radius:10px; padding:13px 20px; font-weight:600; font-size:16px; cursor:pointer; }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.primary:hover { background:var(--blue-deep); }
  .btn.primary:disabled { opacity:.6; cursor:wait; }
  .btn.ghost { background:var(--chip); color:var(--ink); }
  .btn.ghost:hover { background:#e6eaef; }

  /* dialogs */
  dialog { border:0; padding:0; border-radius:16px; width:min(420px,calc(100% - 32px)); max-height:calc(100% - 32px); overflow:auto; background:var(--surface); color:var(--ink); box-shadow:0 24px 60px rgba(11,53,88,.28); }
  dialog[open] { animation:pop .22s cubic-bezier(.2,.9,.3,1.2); }
  dialog::backdrop { background:rgba(11,53,88,.45); backdrop-filter:blur(3px); animation:fade .2s; }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(8px); } }
  @keyframes fade { from { opacity:0; } }
  .ticket { background:var(--ink); color:#fff; padding:22px 22px 18px; position:relative; }
  .ticket .when { margin:0; font-size:14px; color:#a9bbd0; font-weight:500; padding-right:40px; }
  .ticket h2 { margin:4px 0 0; font-family:var(--display); font-size:32px; font-weight:800; line-height:1.05; letter-spacing:-.03em; white-space:nowrap; }
  .x { position:absolute; top:12px; right:12px; width:36px; height:36px; border:0; border-radius:50%; background:rgba(255,255,255,.14); color:#fff; font-size:20px; line-height:1; cursor:pointer; }
  .x:hover { background:rgba(255,255,255,.26); }
  form, .done { padding:20px 22px 24px; }
  .field { margin-bottom:14px; }
  label { display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
  input { width:100%; padding:14px; border:1px solid #cdd5de; border-radius:10px; font-size:16px; background:#fff; color:var(--ink); }
  input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-soft); }
  input[aria-invalid="true"] { border-color:#d92d20; }
  .err { color:#b42318; font-size:13.5px; margin:6px 0 0; }
  .err:empty { display:none; }
  #formErr { background:#fef3f2; border-radius:10px; padding:10px 12px; margin:0 0 14px; }
  form .btn { width:100%; margin-top:4px; }
  .dupbox { padding:24px 22px 22px; }
  .dupbox h2 { margin:0 0 8px; font-family:var(--display); font-size:22px; letter-spacing:-.02em; }
  .dupbox p { margin:0 0 20px; color:var(--muted); }
  .dupbtns { display:flex; gap:10px; }
  .dupbtns .btn { flex:1; padding:13px 10px; }
  .done { text-align:center; }
  .tick { width:64px; height:64px; margin:6px auto 14px; border-radius:50%; background:var(--ok); display:grid; place-items:center; }
  .tick svg { width:32px; height:32px; stroke:#fff; stroke-width:3.2; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:30; stroke-dashoffset:30; animation:draw .45s .15s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .done h2 { margin:0 0 8px; font-family:var(--display); font-size:26px; letter-spacing:-.02em; }
  .done p { margin:0 0 4px; }
  .done .sum { font-weight:700; }
  .done .jam { color:var(--muted); font-weight:600; }
  .done .addr { display:inline-block; margin-top:14px; color:var(--blue); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
  .done .addr:hover { color:var(--blue-deep); }
  .done .btn { width:100%; margin-top:20px; }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .tick svg { stroke-dashoffset:0; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="brand">Hen's Bone Setting</p>
    <h1>Buat janji temu</h1>
    <div id="days" role="group" aria-label="Pilih hari"></div>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h2 id="dayTitle">&nbsp;</h2>
    <span id="dayCount"></span>
  </div>
  <div class="legend" aria-hidden="true">
    <span><i class="l-free"></i>Tersedia</span>
    <span><i class="l-taken"></i>Tidak tersedia</span>
  </div>
  <div id="slots" aria-live="polite"></div>
</main>

<footer class="foot">Hens Bone Setting, Hub : +62811 2345 678</footer>

<dialog id="dlg" aria-labelledby="dTitle">
  <div id="formView">
    <div class="ticket">
      <button type="button" class="x" id="close" aria-label="Tutup">&times;</button>
      <p class="when" id="dWhen"></p>
      <h2 id="dTitle"></h2>
    </div>
    <form id="form" novalidate>
      <p class="err" id="formErr" role="alert"></p>
      <div class="field">
        <label for="name">Nama</label>
        <input id="name" name="name" autocomplete="name" maxlength="80" placeholder="Nama lengkap Anda" required>
        <p class="err" id="nameErr"></p>
      </div>
      <div class="field">
        <label for="phone">Nomor Telepon</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="+62 812 3456 7890" required>
        <p class="err" id="phoneErr"></p>
      </div>
      <button type="submit" class="btn primary" id="save">Simpan</button>
    </form>
  </div>
  <div id="doneView" class="done" hidden>
    <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Berhasil</h2>
    <p class="sum" id="doneDate"></p>
    <p class="jam" id="doneTime"></p>
    <a class="addr" id="addr" target="_blank" rel="noopener">Klik disini untuk melihat alamat kami</a>
    <button type="button" class="btn primary" id="done">Selesai</button>
  </div>
</dialog>

<dialog id="dup" aria-labelledby="dupTitle">
  <div class="dupbox">
    <h2 id="dupTitle">Sudah ada janji temu</h2>
    <p id="dupMsg"></p>
    <div class="dupbtns">
      <button type="button" class="btn ghost" id="dupNo">Tidak</button>
      <button type="button" class="btn primary" id="dupYes">Ya, ubah</button>
    </div>
  </div>
</dialog>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const dlg = $('#dlg');
const LOCALE = 'id-ID';
let cfg = null, taken = new Set(), selDate = null, picked = null;

// 0812 3456 7890 -> +6281234567890 ; 62812... -> +62812... ; 0062... -> +62...
function normPhone(p) {
  let d = String(p).trim();
  if (d.startsWith('+')) { d = d.slice(1).replace(/\D/g, ''); if (d.startsWith('0')) d = '62' + d.slice(1); return '+' + d; }
  d = d.replace(/\D/g, '');
  if (d.startsWith('00')) return '+' + d.slice(2);
  if (d.startsWith('0')) return '+62' + d.slice(1);
  if (d.startsWith('62')) return '+' + d;
  return d;
}
function parts(ymd) { return ymd.split('-').map(Number); }
function addDays(ymd, n) { const [y, m, d] = parts(ymd); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function localDate(ymd) { const [y, m, d] = parts(ymd); return new Date(y, m - 1, d); }
function endTime(t, mins) {
  const [h, m] = t.split(':').map(Number), x = h * 60 + m + mins;
  return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
}
function range(t) { return t + ' - ' + endTime(t, cfg.slotMinutes); }
function fmt(ymd, opts) { return localDate(ymd).toLocaleDateString(LOCALE, opts); }
function dayLabel(ymd) { return fmt(ymd, { weekday: 'long', day: 'numeric', month: 'long' }); }
function fullDate(ymd) { return fmt(ymd, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function isFree(date, t) { const k = date + ' ' + t; return !taken.has(k) && k > cfg.now; }
function openCount(date) { return cfg.times.filter(t => isFree(date, t)).length; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function addressUrl() {
  if (typeof ADDRESS_URL !== 'undefined' && ADDRESS_URL && !ADDRESS_URL.startsWith('PASTE')) return ADDRESS_URL;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent("Hen's Bone Setting");
}

/* ---- existing appointment (this device) ---- */
const STORE = 'hbs_booking';
function saveMine(b) { try { localStorage.setItem(STORE, JSON.stringify(b)); } catch (e) {} }
function getMine() {
  try {
    const b = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (b && b.date && b.time && (b.date + ' ' + b.time) > cfg.now) return b;
  } catch (e) {}
  return null;
}
const dup = $('#dup');
let pending = null;
function askChange(date, time) {
  const m = getMine();
  pending = { date, time, old: m };
  $('#dupMsg').textContent = 'Anda sudah memiliki janji temu pada ' + fullDate(m.date) + ', pukul ' + range(m.time) + '. Ingin mengubah waktu janji temu?';
  dup.showModal();
}
function closeDup() { if (dup.open) dup.close(); }
dup.addEventListener('click', e => { if (e.target === dup) closeDup(); });
$('#dupNo').onclick = closeDup;
$('#dupYes').onclick = () => {
  const p = pending; closeDup();
  if (p) openDialog(p.date, p.time, p.old);
};

function showSkeleton() {
  const s = $('#slots'); s.replaceChildren();
  for (let i = 0; i < 8; i++) s.append(el('div', 'skel'));
}
function showNote(msg, retry) {
  const s = $('#slots'); s.replaceChildren();
  const n = el('div', 'note', msg);
  if (retry) { const b = el('button', 'btn primary', 'Coba lagi'); b.type = 'button'; b.onclick = () => { showSkeleton(); load(); }; n.append(document.createElement('br'), b); }
  s.append(n);
}

async function load() {
  if (!API_URL || API_URL.startsWith('PASTE')) { showNote('Isi API_URL di config.js terlebih dahulu.'); return; }
  try {
    const r = await fetch(API_URL + '?action=slots');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    cfg = d.config;
    taken = new Set(d.taken.map(t => t.date + ' ' + t.time));
    if (!selDate || selDate < cfg.today) selDate = cfg.today;
    render();
  } catch (e) {
    if (!cfg) showNote('Jadwal gagal dimuat. Periksa koneksi internet Anda.', true);
  }
}

function render() {
  const days = $('#days'); days.replaceChildren();
  for (let i = 0; i < cfg.days; i++) {
    const ymd = addDays(cfg.today, i), n = openCount(ymd);
    const b = el('button', 'day ' + (n === 0 ? 'none' : n <= 2 ? 'low' : 'ok'));
    b.type = 'button';
    b.setAttribute('aria-pressed', ymd === selDate);
    b.setAttribute('aria-label', fullDate(ymd) + ', ' + n + ' jam tersedia');
    b.append(el('span', 'dn', i === 0 ? 'Hari ini' : fmt(ymd, { weekday: 'short' })),
             el('span', 'dd', localDate(ymd).getDate()),
             el('span', 'dc', n ? n + ' kosong' : 'Penuh'));
    b.onclick = () => { selDate = ymd; render(); };
    days.append(b);
  }
  $('#dayTitle').textContent = fullDate(selDate);
  const n = openCount(selDate);
  $('#dayCount').textContent = n ? n + ' dari ' + cfg.times.length + ' jam tersedia' : 'Semua jam sudah terisi';

  const list = $('#slots'); list.replaceChildren();
  cfg.times.forEach(t => {
    const free = isFree(selDate, t);
    const b = el('button', 'slot ' + (free ? 'free' : 'taken'));
    b.type = 'button';
    b.disabled = !free;
    b.append(el('small', null, free ? 'Tersedia' : 'Tidak tersedia'), el('b', null, range(t)));
    b.setAttribute('aria-label', range(t) + (free ? ', tersedia' : ', tidak tersedia'));
    if (free) b.onclick = () => getMine() ? askChange(selDate, t) : openDialog(selDate, t);
    list.append(b);
  });
}

/* ---- dialog ---- */
function setErr(id, msg) {
  $('#' + id).textContent = msg || '';
  const input = { nameErr: '#name', phoneErr: '#phone' }[id];
  if (input) $(input).setAttribute('aria-invalid', msg ? 'true' : 'false');
}
function openDialog(date, time, old) {
  picked = { date, time, old: old || null };
  $('#dWhen').textContent = fullDate(date);
  $('#dTitle').textContent = range(time);
  $('#form').reset();
  if (old && old.name) { $('#name').value = old.name; $('#phone').value = old.phone || ''; }
  ['nameErr', 'phoneErr', 'formErr'].forEach(i => setErr(i, ''));
  $('#formView').hidden = false; $('#doneView').hidden = true;
  $('#save').disabled = false; $('#save').textContent = 'Simpan';
  dlg.showModal();
  $('#name').focus();
}
function closeDialog() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { picked = null; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); }); // backdrop
$('#close').onclick = closeDialog;
$('#done').onclick = closeDialog;

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!picked) return;
  const name = $('#name').value.trim(), phoneRaw = $('#phone').value.trim();
  setErr('formErr', '');
  const nameBad = name.length < 2 ? 'Masukkan nama Anda.' : '';
  const phoneBad = /^[0-9+\-\s()]{7,20}$/.test(phoneRaw) ? '' : 'Masukkan nomor telepon yang valid, contoh +62 812 3456 7890.';
  setErr('nameErr', nameBad); setErr('phoneErr', phoneBad);
  if (nameBad) return $('#name').focus();
  if (phoneBad) return $('#phone').focus();
  const phone = normPhone(phoneRaw);

  const save = $('#save'); save.disabled = true; save.textContent = 'Menyimpan…';
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(picked.old
        ? { action: 'reschedule', oldDate: picked.old.date, oldTime: picked.old.time, date: picked.date, time: picked.time, name, phone }
        : { action: 'book', date: picked.date, time: picked.time, name, phone })
    });
    const d = await r.json();
    if (!d.ok) {
      if (/duplicate|already|exist/i.test(d.error || '') && d.existing && !picked.old) {
        saveMine({ date: d.existing.date, time: d.existing.time, name, phone });
        const t = picked;
        await load();
        closeDialog();
        askChange(t.date, t.time);
        return;
      }
      const gone = /taken|past/i.test(d.error || '');
      setErr('formErr', gone ? 'Maaf, jam ini sudah tidak tersedia. Silakan pilih jam lain.' : 'Gagal menyimpan. Silakan coba lagi.');
      save.disabled = false; save.textContent = 'Simpan';
      await load();
      if (gone) setTimeout(closeDialog, 2200);
      return;
    }
    saveMine({ date: picked.date, time: picked.time, name, phone });
    $('#doneDate').textContent = fullDate(picked.date);
    $('#doneTime').textContent = 'Pukul: ' + range(picked.time);
    $('#addr').href = addressUrl();
    $('#formView').hidden = true; $('#doneView').hidden = false;
    $('#done').focus();
    load();
  } catch (err) {
    setErr('formErr', 'Tidak ada koneksi. Periksa internet Anda lalu tekan Simpan lagi.');
    save.disabled = false; save.textContent = 'Simpan';
  }
});

showSkeleton();
load();
setInterval(() => { if (!dlg.open) load(); }, 30000);
</script>
</body>
</html>
