<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Hen's Bone Setting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0b3558; --muted:#5b6f86; --line:#e3e7ec;
    --blue:#006bff; --blue-deep:#0052cc; --blue-soft:#eaf2ff;
    --ok:#17a05d;
    --paper:#f7f8fa; --surface:#fff; --chip:#f1f3f6;
    --ring:0 0 0 1px rgba(34,42,53,.08);
    --lift:0 4px 14px rgba(71,103,136,.16);
    --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); line-height:1.45; }
  body.busy { cursor:progress; }
  body.busy button { pointer-events:none; opacity:.6; }
  button, input { font:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid #3b82f6; outline-offset:2px; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 16px; }

  /* login */
  .login-page { min-height:100vh; background:var(--paper); display:grid; place-items:center; padding:20px; }
  .login { width:min(380px,100%); background:var(--surface); border-radius:16px; padding:28px 24px 24px; box-shadow:var(--ring), 0 12px 40px rgba(71,103,136,.16); }
  .login .brand { margin:0 0 2px; font-weight:600; font-size:14px; color:var(--muted); }
  .login h1 { margin:0 0 18px; font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.03em; }
  label { display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
  .login input { width:100%; padding:14px; border:1px solid #cdd5de; border-radius:10px; font-size:16px; background:#fff; color:var(--ink); }
  .login input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-soft); }
  #lerr { color:#b42318; font-size:13.5px; min-height:20px; margin:8px 0 0; }
  .btn { border:0; border-radius:10px; padding:13px 20px; font-weight:600; font-size:16px; }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.primary:hover { background:var(--blue-deep); }
  .btn.ghost { background:var(--chip); color:var(--ink); }
  .btn.ghost:hover { background:#e6eaef; }
  .login .btn { width:100%; margin-top:8px; }

  /* header */
  .hero { background:var(--surface); color:var(--ink); padding:18px 0 14px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .top b { font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .topbtns { display:flex; gap:8px; }
  .top b small { font-weight:600; font-size:12px; background:var(--blue-soft); color:var(--blue); padding:3px 9px; border-radius:20px; margin-left:8px; vertical-align:1px; }
  .pill { border:0; border-radius:10px; padding:8px 14px; background:var(--chip); color:var(--ink); font-weight:600; font-size:14px; }
  .pill:hover { background:#e6eaef; }
  .row2 { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; justify-content:space-between; }
  .row2 h1 { margin:0; font-family:var(--display); font-weight:800; font-size:clamp(24px,5vw,32px); line-height:1.1; letter-spacing:-.03em; }
  .nav { display:flex; align-items:center; gap:8px; }
  #range { font-weight:600; font-size:14px; min-width:150px; text-align:center; color:var(--muted); }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { display:inline-flex; align-items:center; gap:7px; background:var(--chip); color:var(--ink); border:0; border-radius:10px; padding:7px 12px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .chip:hover { background:#e6eaef; }
  .chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .chip .c-p { background:#f5b400; } .chip .c-a { background:var(--ok); } .chip .c-b { background:#98a4b3; }
  .chip b { font-family:var(--display); font-size:16px; }

  /* day tabs (small screens) */
  #tabs { display:flex; gap:8px; overflow-x:auto; padding:8px 6px 8px; margin:10px -6px 0; scroll-padding-inline:6px; scrollbar-width:none; scroll-snap-type:x proximity; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 66px; scroll-snap-align:start; border:0; border-radius:12px; padding:9px 4px; background:var(--chip); color:var(--ink); text-align:center; position:relative; transition:transform .15s, box-shadow .15s; }
  .tab .dn { display:block; font-size:11.5px; font-weight:600; color:var(--muted); }
  .tab .dd { display:block; font-family:var(--display); font-weight:700; font-size:22px; line-height:1.1; margin-top:1px; letter-spacing:-.02em; }
  .tab[aria-pressed="true"] { background:#fff; box-shadow:0 0 0 2px var(--blue); transform:translateY(-2px); }
  .tab .np { position:absolute; top:-6px; right:-3px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:#f5b400; color:#3d2a00; font-size:12px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 2px #fff; }

  /* week grid (wide screens) */
  main.wrap { padding-top:22px; padding-bottom:16px; }
  .fnav { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:15; display:grid; grid-template-columns:1fr 1fr; padding:5px; border-radius:999px; background:rgba(255,255,255,.74); -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%); box-shadow:0 0 0 1px rgba(34,42,53,.08), 0 10px 30px rgba(11,53,88,.2); touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab; }
  .fnav.drag { cursor:grabbing; }
  .fnav .thumb { position:absolute; top:5px; bottom:5px; left:5px; width:calc((100% - 10px) / 2); border-radius:999px; background:var(--blue); box-shadow:0 4px 12px rgba(0,107,255,.35); transition:transform .55s cubic-bezier(.22,1,.36,1); will-change:transform; }
  .fnav.drag .thumb { transition:none; }
  .fnav button { position:relative; z-index:1; display:inline-flex; align-items:center; justify-content:center; gap:7px; border:0; background:transparent; color:var(--muted); font-weight:600; font-size:14px; padding:11px 20px; border-radius:999px; white-space:nowrap; touch-action:manipulation; transition:color .35s cubic-bezier(.22,1,.36,1); }
  .fnav button svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  @media (hover:hover) { .fnav button:not([aria-current="page"]):hover { color:var(--ink); } }
  .fnav button[aria-current="page"] { color:#fff; }
  .pg-in { animation:pgIn .55s cubic-bezier(.22,1,.36,1); }
  @keyframes pgIn { from { opacity:0; transform:translate3d(var(--dx,0),10px,0); } }
  .foot { background:var(--ink); color:#cbd7e5; text-align:center; font-size:13.5px; font-weight:500; padding:20px 16px calc(20px + 72px + env(safe-area-inset-bottom,0px)); }
  #grid { display:grid; grid-template-columns:62px repeat(7,minmax(150px,1fr)); gap:8px; }
  .dh { padding:8px 6px; text-align:center; border-radius:10px; background:var(--surface); box-shadow:var(--ring); display:flex; flex-direction:column; }
  .dh b { font-family:var(--display); font-size:15px; letter-spacing:-.01em; }
  .dh span { font-size:12.5px; color:var(--muted); }
  .dh.today { background:var(--blue); color:#fff; box-shadow:none; }
  .dh.today span { color:#d6e6ff; }
  .tl { font-weight:600; font-size:13px; color:var(--muted); padding:12px 4px 0 0; text-align:right; }

  /* list (small screens) */
  #list { display:none; }
  .lrow { display:grid; grid-template-columns:54px 1fr; gap:8px; margin-bottom:8px; }

  /* cells + cards */
  .cell { min-height:96px; }
  .cell.past { opacity:.55; }
  .empty { width:100%; height:100%; min-height:96px; border:1.5px dashed #cdd5de; border-radius:12px; background:transparent; color:var(--muted); font-size:13px; font-weight:600; }
  .empty:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-soft); }
  .empty:disabled, .empty:disabled:hover { cursor:not-allowed; border-color:#cdd5de; color:var(--muted); background:transparent; }
  .card.cardbtn { display:block; width:100%; text-align:left; font:inherit; color:var(--ink); border:0; border-left:4px solid #98a4b3; cursor:pointer; }
  .card.cardbtn:hover { background:#e3e7ec; }
  .card.cardbtn:disabled { cursor:not-allowed; }
  .hint { font-size:12.5px; font-weight:600; color:var(--muted); margin-top:4px; }
  .acts button:disabled { cursor:not-allowed; opacity:.5; }
  .card { border-radius:12px; padding:10px 12px 11px; border-left:4px solid; background:var(--surface); box-shadow:var(--ring); height:100%; }
  .card.Pending { border-color:#f5b400; background:#fff7dd; }
  .card.Approved { border-color:var(--ok); background:#e7f6ee; }
  .card.Disabled { border-color:#98a4b3; background:#eef0f3; }
  .card .nm { font-weight:700; word-break:break-word; }
  .card .nm.none { color:var(--muted); font-style:italic; font-weight:600; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:5px; }
  .meta a { font-size:13px; font-weight:600; color:var(--blue); text-decoration:none; background:rgba(255,255,255,.8); border-radius:8px; padding:3px 8px; }
  .meta a:hover { background:#fff; text-decoration:underline; }
  .badge { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:20px; background:rgba(11,53,88,.08); }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .acts button { border:0; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; }
  .b-ap { background:var(--ok); color:#fff; } .b-ap:hover { background:#0f8449; }
  .b-ca { background:#fff; color:var(--ink); box-shadow:var(--ring); } .b-ca:hover { background:#f1f3f6; }
  .b-di { background:#fde8ea; color:#b42318; } .b-di:hover { background:#fbd5d9; }

  @media (max-width:899px) {
    #grid { display:none; }
    #list { display:block; }
    .row2 h1 { width:100%; }
  }
  @media (min-width:900px) {
    #tabs { display:none; }
    main { overflow-x:auto; }
    #grid { min-width:1130px; }
  }

  /* dialog + toast */
  dialog { border:0; padding:0; border-radius:16px; width:min(400px,calc(100% - 32px)); background:var(--surface); color:var(--ink); box-shadow:0 24px 60px rgba(11,53,88,.28); }
  dialog[open] { animation:pop .22s cubic-bezier(.2,.9,.3,1.2); }
  dialog::backdrop { background:rgba(11,53,88,.45); backdrop-filter:blur(3px); }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(8px); } }
  .cbox { padding:24px 22px 22px; }
  .cbox h2 { margin:0 0 8px; font-family:var(--display); font-size:22px; letter-spacing:-.02em; }
  .cbox p { margin:0 0 20px; color:var(--muted); }
  .cbtns { display:flex; gap:10px; }
  .cbtns .btn { flex:1; padding:13px 10px; }
  .cbox p.sub { margin:0 0 10px; font-size:13.5px; }
  .rlist { max-height:50vh; overflow:auto; margin:0 -6px 16px; padding:0 6px 2px; }
  .rrow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px; border-top:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .rrow:hover { background:var(--paper); }
  .rrow .when { font-size:12.5px; font-weight:600; color:var(--muted); }
  .rrow .who { font-weight:700; word-break:break-word; }
  .rrow .ph { font-size:13px; color:var(--muted); }
  .rrow button { border:0; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; background:var(--ok); color:#fff; flex:none; }
  .rempty { padding:14px 12px; color:var(--muted); border-top:1px solid var(--line); }
  .plist { max-height:50vh; overflow:auto; margin:0 -6px 14px; padding:0 6px; }
  .prow { display:grid; grid-template-columns:104px 1fr; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .prow img { width:104px; aspect-ratio:16/9; object-fit:cover; border-radius:10px; background:#eceff3; display:block; }
  .pbtns { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .pbtns .n { font-weight:700; font-size:13px; color:var(--muted); margin-right:4px; }
  .pbtns button { border:0; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; background:var(--chip); color:var(--ink); }
  .pbtns button:hover:not(:disabled) { background:#e6eaef; }
  .pbtns button:disabled { opacity:.4; cursor:not-allowed; }
  .pbtns .del { background:#fde8ea; color:#b42318; } .pbtns .del:hover:not(:disabled) { background:#fbd5d9; }
  .pempty { padding:14px 2px; color:var(--muted); border-top:1px solid var(--line); }
  .padd { display:flex; gap:10px; margin-bottom:14px; }
  .padd .btn { flex:1; }
  #setMain { max-width:720px; }
  .sh { margin:0 0 16px; font-family:var(--display); font-weight:800; font-size:clamp(24px,5vw,32px); letter-spacing:-.03em; }
  .panel { background:var(--surface); border-radius:16px; box-shadow:var(--ring); padding:18px; margin-bottom:16px; }
  .panel h2 { margin:0 0 4px; font-family:var(--display); font-size:20px; letter-spacing:-.02em; }
  .hint2 { margin:0 0 14px; color:var(--muted); font-size:13.5px; }
  .seg { display:inline-flex; background:var(--chip); border-radius:12px; padding:4px; gap:4px; }
  .seg button { border:0; background:transparent; border-radius:9px; padding:9px 20px; font-weight:600; font-size:14px; color:var(--muted); transition:background .2s, color .2s; }
  .seg button[aria-pressed="true"].on { background:var(--ok); color:#fff; }
  .seg button[aria-pressed="true"].off { background:#fff; color:var(--ink); box-shadow:var(--ring); }
  .panel.off #pList { opacity:.5; }
  .frow { display:flex; gap:10px; }
  .frow input { flex:1; min-width:0; padding:12px 14px; border:1px solid #cdd5de; border-radius:10px; font-size:16px; background:#fff; color:var(--ink); }
  .frow input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-soft); }
  .frow .btn { padding:12px 20px; }
  .btn.danger { background:#d92d20; color:#fff; } .btn.danger:hover { background:#b42318; }
  #toast { position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s; z-index:20; max-width:calc(100% - 32px); }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <form id="login" class="login">
    <p class="brand">Hen's Bone Setting</p>
    <h1>Admin</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p id="lerr" role="alert"></p>
    <button type="submit" class="btn primary" id="lbtn">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <b>Hen's Bone Setting <small>Admin</small></b>
        <div class="topbtns"><button class="pill" id="logout" type="button">Log out</button></div>
      </div>
      <div id="apptHead">
      <div class="row2">
        <h1>Appointments</h1>
        <div class="nav">
          <button class="pill" id="prev" type="button" aria-label="Previous week">‹</button>
          <span id="range"></span>
          <button class="pill" id="next" type="button" aria-label="Next week">›</button>
          <button class="pill" id="todayBtn" type="button">Today</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div id="tabs" role="group" aria-label="Choose day"></div>
      </div>
    </div>
  </header>
  <main class="wrap" id="apptMain">
    <div id="grid"></div>
    <div id="list"></div>
  </main>
  <main class="wrap" id="setMain" hidden>
    <h1 class="sh">Setting</h1>
    <section class="panel" id="carPanel">
      <h2>Carousel</h2>
      <p class="hint2" id="carNote"></p>
      <div class="seg" role="group" aria-label="Carousel">
        <button type="button" class="on" id="carOn">Enable</button>
        <button type="button" class="off" id="carOff">Disable</button>
      </div>
      <div class="padd" style="margin-top:16px">
        <button type="button" class="btn primary" id="pAdd">Add photos</button>
        <input type="file" id="pFile" accept="image/*" multiple hidden>
      </div>
      <div id="pList"></div>
    </section>
    <section class="panel">
      <h2>Footer</h2>
      <p class="hint2">Text shown at the bottom of the booking page. Leave empty for the default.</p>
      <div class="frow">
        <input id="fText" maxlength="200" placeholder="Hen's Bone Setting" autocomplete="off">
        <button type="button" class="btn primary" id="fSave">Save</button>
      </div>
    </section>
  </main>
  <nav class="fnav" aria-label="Pages">
    <span class="thumb" aria-hidden="true"></span>
    <button type="button" id="navAppt" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Reservation
    </button>
    <button type="button" id="navSet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setting
    </button>
  </nav>
  <footer class="foot">Hen's Bone Setting</footer>
</div>

<dialog id="rec" aria-labelledby="rTitle">
  <div class="cbox">
    <h2 id="rTitle"></h2>
    <p class="sub" id="rSub"></p>
    <div class="rlist" id="rList"></div>
    <div class="cbtns"><button type="button" class="btn ghost" id="rClose" autofocus>Close</button></div>
  </div>
</dialog>

<dialog id="cfm" aria-labelledby="cTitle">
  <div class="cbox">
    <h2 id="cTitle">Cancel appointment?</h2>
    <p id="cMsg"></p>
    <div class="cbtns">
      <button type="button" class="btn ghost" id="cNo">Keep it</button>
      <button type="button" class="btn danger" id="cYes">Cancel it</button>
    </div>
  </div>
</dialog>
<div id="toast"></div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const mq = window.matchMedia('(min-width:900px)');
let token = '', cfg = null, weekStart = '', rows = [], selDay = '';

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  kids.flat().filter(Boolean).forEach(c => e.append(c));
  return e;
}
function parts(ymd) { return ymd.split('-').map(Number); }
function addDays(ymd, n) { const [y, m, d] = parts(ymd); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function localDate(ymd) { const [y, m, d] = parts(ymd); return new Date(y, m - 1, d); }
function md(ymd) { return localDate(ymd).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function dow(ymd) { return localDate(ymd).toLocaleDateString('en-US', { weekday: 'short' }); }
function longDate(ymd) { return localDate(ymd).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); }
function waLink(phone) {
  let d = String(phone).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '62' + d.slice(1);
  return 'https://wa.me/' + d;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ---- api: password is sent only by login(); afterwards a short-lived token is used ---- */
async function api(body) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, token })
  });
  return r.json();
}
function expired(e) { return /session|password/i.test((e && e.message) || ''); }

async function load() {
  const r = await api({ action: 'admin_list', from: weekStart });
  if (!r.ok) throw new Error(r.error);
  cfg = r.config; weekStart = r.from; rows = r.rows;
  const week = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  if (!week.includes(selDay)) selDay = week.includes(cfg.today) ? cfg.today : weekStart;
  render();
}
function safeLoad() {
  return load().catch(e => { if (expired(e)) logout(); else toast(e.message || 'Error'); });
}

/* ---- render ---- */
function render() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  $('#range').textContent = md(weekStart) + ' – ' + md(days[6]) + ', ' + localDate(days[6]).getFullYear();

  const count = s => rows.filter(r => r.status === s).length;
  const st = $('#stats'); st.replaceChildren(
    h('button', { class: 'chip', type: 'button', onclick: () => showRecords('Pending') }, h('i', { class: 'c-p' }), h('b', { text: count('Pending') }), 'pending'),
    h('button', { class: 'chip', type: 'button', onclick: () => showRecords('Approved') }, h('i', { class: 'c-a' }), h('b', { text: count('Approved') }), 'approved'));

  const byKey = new Map(rows.map(r => [r.date + ' ' + r.time, r]));

  const tabs = $('#tabs'); tabs.replaceChildren();
  days.forEach(d => {
    const np = rows.filter(r => r.date === d && r.status === 'Pending').length;
    const b = h('button', { class: 'tab', type: 'button', onclick: () => { selDay = d; render(); } },
      h('span', { class: 'dn', text: d === cfg.today ? 'Today' : dow(d) }),
      h('span', { class: 'dd', text: localDate(d).getDate() }),
      np ? h('span', { class: 'np', text: np }) : null);
    b.setAttribute('aria-pressed', d === selDay);
    tabs.append(b);
  });

  const g = $('#grid'); g.replaceChildren();
  const list = $('#list'); list.replaceChildren();
  if (mq.matches) {
    g.append(h('div'));
    days.forEach(d => g.append(h('div', { class: 'dh' + (d === cfg.today ? ' today' : '') },
      h('b', { text: dow(d) }), h('span', { text: md(d) }))));
    cfg.times.forEach(t => {
      g.append(h('div', { class: 'tl', text: t }));
      days.forEach(d => g.append(cell(d, t, byKey.get(d + ' ' + t))));
    });
  } else {
    list.append(h('p', { text: longDate(selDay), style: 'margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:20px;' }));
    cfg.times.forEach(t => list.append(h('div', { class: 'lrow' },
      h('div', { class: 'tl', text: t }), cell(selDay, t, byKey.get(selDay + ' ' + t)))));
  }
}

function cell(d, t, r) {
  const past = (d + ' ' + t) <= cfg.now;
  const c = h('div', { class: 'cell' + (past ? ' past' : '') });
  if (!r) {
    c.append(h('button', { class: 'empty', type: 'button', text: 'Click to Block', disabled: past,
      onclick: () => act({ action: 'disable', date: d, time: t }, 'Slot blocked.') }));
    return c;
  }
  const named = !!r.name;
  if (!named) { // blocked slot: the whole card is the unblock button
    c.append(h('button', { class: 'card Disabled cardbtn', type: 'button', disabled: past,
      onclick: () => act({ action: 'update', id: r.id, status: 'Cancelled' }, 'Slot unblocked.') },
      h('div', { class: 'nm none', text: 'Blocked' }),
      h('div', { class: 'hint', text: 'Click to Unblock' })));
    return c;
  }
  const acts = h('div', { class: 'acts' });
  if (r.status !== 'Approved') acts.append(h('button', { class: 'b-ap', type: 'button', text: 'Approve', disabled: past,
    onclick: () => act({ action: 'update', id: r.id, status: 'Approved' }, 'Approved.') }));
  acts.append(h('button', { class: 'b-ca', type: 'button', text: 'Cancel', disabled: past,
    onclick: () => confirmBox('Cancel appointment?', r.name + ' · ' + longDate(d) + ', ' + t + '. The slot becomes available again.',
      () => act({ action: 'update', id: r.id, status: 'Cancelled' }, 'Slot available again.')) }));
  const meta = h('div', { class: 'meta' },
    r.phone ? h('a', { href: 'tel:' + r.phone, text: r.phone }) : null,
    r.phone ? h('a', { href: waLink(r.phone), target: '_blank', rel: 'noopener', text: 'WhatsApp' }) : null,
    h('span', { class: 'badge', text: r.status }));
  c.append(h('div', { class: 'card ' + r.status },
    h('div', { class: 'nm', text: r.name }),
    meta, acts));
  return c;
}

/* ---- records dialog (tap a counter) ---- */
const rec = $('#rec');
function showRecords(status) {
  const list = rows.filter(r => r.status === status && r.name)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  $('#rTitle').textContent = (status === 'Pending' ? 'Pending' : 'Approved') + ' (' + list.length + ')';
  $('#rSub').textContent = md(weekStart) + ' – ' + md(addDays(weekStart, 6)) + ' · tap a record to jump to it';
  const box = $('#rList'); box.replaceChildren();
  if (!list.length) box.append(h('div', { class: 'rempty', text: 'No ' + status.toLowerCase() + ' appointments in this range.' }));
  list.forEach(r => {
    const past = (r.date + ' ' + r.time) <= cfg.now;
    const row = h('div', { class: 'rrow', onclick: () => { selDay = r.date; rec.close(); render(); } },
      h('div', null,
        h('div', { class: 'when', text: dow(r.date) + ', ' + md(r.date) + ' · ' + r.time }),
        h('div', { class: 'who', text: r.name }),
        h('div', { class: 'ph', text: r.phone })));
    if (status === 'Pending' && !past) row.append(h('button', { type: 'button', text: 'Approve',
      onclick: e => { e.stopPropagation(); rec.close(); act({ action: 'update', id: r.id, status: 'Approved' }, 'Approved.'); } }));
    box.append(row);
  });
  rec.showModal();
}
$('#rClose').onclick = () => rec.close();
rec.addEventListener('click', e => { if (e.target === rec) rec.close(); });

/* ---- Setting page: carousel on/off, photos, footer ---- */
let S = { enabled: true, footer: '', images: [], max: 10 };
let queue = Promise.resolve();
const thumbUrl = id => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400';
function fail(e) { if (expired(e)) logout(); else { toast((e && e.message) || 'Error'); loadSettings(); } }
// Quick actions update the screen first and sync in the background, one request at a time.
function sync(payload) { queue = queue.then(() => api(payload)).then(r => { if (!r.ok) throw new Error(r.error); }).catch(fail); return queue; }

async function loadSettings() {
  try {
    const r = await api({ action: 'settings_get' });
    if (!r.ok) throw new Error(r.error);
    S = { enabled: r.carouselEnabled, footer: r.footer, images: r.images, max: r.max || 10 };
    if (document.activeElement !== $('#fText')) $('#fText').value = S.footer;
    renderCarousel();
  } catch (e) { if (expired(e)) logout(); else toast(e.message || 'Error'); }
}
function renderCarousel() {
  $('#carOn').setAttribute('aria-pressed', S.enabled);
  $('#carOff').setAttribute('aria-pressed', !S.enabled);
  $('#carNote').textContent = S.enabled ? 'Photos are shown at the top of the booking page.' : 'Disabled: the carousel is hidden on the booking page.';
  $('#carPanel').classList.toggle('off', !S.enabled);
  $('#pAdd').disabled = S.images.length >= S.max;
  $('#pAdd').textContent = 'Add photos (' + S.images.length + '/' + S.max + ')';
  const box = $('#pList'); box.replaceChildren();
  if (!S.images.length) box.append(h('div', { class: 'pempty', text: 'No photos yet.' }));
  S.images.forEach((p, i) => box.append(h('div', { class: 'prow' },
    h('img', { src: thumbUrl(p.fileId), alt: 'Photo ' + (i + 1), loading: 'lazy' }),
    h('div', { class: 'pbtns' },
      h('span', { class: 'n', text: '#' + (i + 1) }),
      h('button', { type: 'button', text: '↑', title: 'Move up', disabled: i === 0, onclick: () => movePhoto(i, 'up') }),
      h('button', { type: 'button', text: '↓', title: 'Move down', disabled: i === S.images.length - 1, onclick: () => movePhoto(i, 'down') }),
      h('button', { type: 'button', class: 'del', text: 'Remove', onclick: () => removePhoto(i) })))));
}
function setEnabled(on) {
  if (S.enabled === on) return;
  S.enabled = on; renderCarousel();
  sync({ action: 'settings_set', carouselEnabled: on }).then(() => toast(on ? 'Carousel enabled.' : 'Carousel disabled.'));
}
function movePhoto(i, dir) {
  const j = dir === 'up' ? i - 1 : i + 1;
  if (j < 0 || j >= S.images.length) return;
  const id = S.images[i].id;
  [S.images[i], S.images[j]] = [S.images[j], S.images[i]]; renderCarousel();
  sync({ action: 'carousel_move', id, dir });
}
function removePhoto(i) {
  const p = S.images[i];
  confirmBox('Remove photo?', 'Photo #' + (i + 1) + ' will be removed from the carousel.', () => {
    S.images = S.images.filter(x => x.id !== p.id); renderCarousel();
    sync({ action: 'carousel_delete', id: p.id }).then(() => toast('Photo removed.'));
  });
}
// Resize to max 1600px wide and re-encode as JPEG so uploads stay small and fast on mobile data.
function compress(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read ' + file.name)); };
    img.src = url;
  });
}
async function uploadFiles(files) {
  const list = Array.from(files).slice(0, S.max - S.images.length);
  if (!list.length) { toast('Maximum ' + S.max + ' photos.'); return; }
  document.body.classList.add('busy');
  try {
    for (let i = 0; i < list.length; i++) {
      toast('Uploading ' + (i + 1) + '/' + list.length + '…');
      const data = await compress(list[i]);
      const r = await api({ action: 'carousel_add', mime: 'image/jpeg', data });
      if (!r.ok) throw new Error(r.error);
    }
    await loadSettings();
    toast(list.length > 1 ? 'Photos added.' : 'Photo added.');
  } catch (e) {
    if (expired(e)) { logout(); return; }
    toast(e.message || 'Upload failed.'); await loadSettings();
  } finally { document.body.classList.remove('busy'); $('#pFile').value = ''; }
}
async function saveFooter() {
  const btn = $('#fSave'); btn.disabled = true;
  try {
    const r = await api({ action: 'settings_set', footer: $('#fText').value });
    if (!r.ok) throw new Error(r.error);
    S.footer = $('#fText').value.trim(); $('#fText').value = S.footer;
    toast(S.footer ? 'Footer saved.' : 'Footer reset to default.');
  } catch (e) { if (expired(e)) logout(); else toast(e.message || 'Error'); }
  finally { btn.disabled = false; }
}
$('#carOn').onclick = () => setEnabled(true);
$('#carOff').onclick = () => setEnabled(false);
$('#pAdd').onclick = () => $('#pFile').click();
$('#pFile').onchange = e => uploadFiles(e.target.files);
$('#fSave').onclick = saveFooter;
$('#fText').addEventListener('keydown', e => { if (e.key === 'Enter') saveFooter(); });

/* ---- pages: appointments / setting (#setting) ---- */
let curSet = null;
const nav = $('.fnav'), thumb = $('.fnav .thumb');
const slideThumb = i => { thumb.style.transform = 'translateX(' + (i * 100) + '%)'; };
function applyPage() {
  const set = location.hash === '#setting';
  $('#apptHead').hidden = set; $('#apptMain').hidden = set; $('#setMain').hidden = !set;
  $('#navAppt').setAttribute('aria-current', set ? 'false' : 'page');
  $('#navSet').setAttribute('aria-current', set ? 'page' : 'false');
  slideThumb(set ? 1 : 0);
  window.scrollTo(0, 0);
  if (curSet !== null && curSet !== set) {            // animate only when the page actually changes
    const targets = set ? [$('#setMain')] : [$('#apptHead'), $('#apptMain')];
    targets.forEach(t => {
      t.classList.remove('pg-in'); t.style.setProperty('--dx', (set ? 28 : -28) + 'px');
      void t.offsetWidth; t.classList.add('pg-in');
      t.addEventListener('animationend', () => t.classList.remove('pg-in'), { once: true });
    });
  }
  curSet = set;
  if (set) loadSettings();
}
function goPage(toSet) {
  if ((location.hash === '#setting') === toSet) { slideThumb(toSet ? 1 : 0); return; }
  location.hash = toSet ? '#setting' : '';
}
$('#navAppt').onclick = () => { if (!nav.dataset.moved) goPage(false); };
$('#navSet').onclick = () => { if (!nav.dataset.moved) goPage(true); };

// Swipe (drag) the bar: the blue pill follows your finger and snaps to the nearest page.
let dragX = null, dragStart = 0, dragW = 0, dragOff = 0;
nav.addEventListener('pointerdown', e => {
  dragX = e.clientX; dragW = thumb.offsetWidth; dragStart = location.hash === '#setting' ? dragW : 0; dragOff = dragStart;
  delete nav.dataset.moved;
});
nav.addEventListener('pointermove', e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX;
  if (!nav.classList.contains('drag')) {
    if (Math.abs(dx) < 6) return;
    nav.classList.add('drag'); nav.dataset.moved = '1'; nav.setPointerCapture(e.pointerId);
  }
  dragOff = Math.max(0, Math.min(dragW, dragStart + dx));
  thumb.style.transform = 'translateX(' + dragOff + 'px)';
});
function endDrag(e) {
  if (dragX === null) return;
  const dx = e.clientX - dragX, moved = nav.classList.contains('drag');
  dragX = null; nav.classList.remove('drag');
  if (!moved) return;
  const flick = Math.abs(dx) > dragW * 0.3;            // short flick also switches
  const toSet = flick ? dx > 0 : dragOff > dragW / 2;
  goPage(toSet);
  setTimeout(() => { delete nav.dataset.moved; }, 50);
}
nav.addEventListener('pointerup', endDrag);
nav.addEventListener('pointercancel', endDrag);

window.addEventListener('hashchange', () => { if (!$('#app').hidden) applyPage(); });

/* ---- confirm dialog ---- */
const cfm = $('#cfm');
let onYes = null;
function confirmBox(title, msg, yes) {
  $('#cTitle').textContent = title; $('#cMsg').textContent = msg; onYes = yes; cfm.showModal();
}
$('#cNo').onclick = () => cfm.close();
$('#cYes').onclick = () => { const f = onYes; cfm.close(); if (f) f(); };
cfm.addEventListener('click', e => { if (e.target === cfm) cfm.close(); });

async function act(payload, okMsg) {
  document.body.classList.add('busy');
  try {
    const r = await api(payload);
    if (!r.ok) throw new Error(r.error);
    await load();
    toast(okMsg);
  } catch (e) {
    if (expired(e)) { logout(); return; }
    toast(e.message || 'Error'); try { await load(); } catch (_) {}
  } finally {
    document.body.classList.remove('busy');
  }
}

/* ---- session ---- */
function showApp() { $('#loginPage').hidden = true; $('#app').hidden = false; applyPage(); }
function logout() { sessionStorage.removeItem('adminTok'); token = ''; location.reload(); }

async function signIn(pw) {
  const r = await api({ action: 'login', password: pw });
  if (!r.ok) throw new Error(r.error);
  token = r.token;
  await load();
  sessionStorage.setItem('adminTok', token);
  showApp();
}

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw'), btn = $('#lbtn');
  $('#lerr').textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  try { await signIn(pw.value); }
  catch (err) { $('#lerr').textContent = err.message || 'Login failed.'; token = ''; }
  finally { pw.value = ''; btn.disabled = false; btn.textContent = 'Sign in'; }
});
$('#prev').onclick = () => { weekStart = addDays(weekStart, -7); safeLoad(); };
$('#next').onclick = () => { weekStart = addDays(weekStart, 7); safeLoad(); };
$('#todayBtn').onclick = () => { weekStart = ''; selDay = ''; safeLoad(); };
$('#logout').onclick = logout;
mq.addEventListener('change', () => { if (cfg) render(); });

if (!API_URL || API_URL.startsWith('PASTE')) {
  $('#lerr').textContent = 'Set API_URL in config.js first.';
} else {
  const saved = sessionStorage.getItem('adminTok');
  if (saved) {
    token = saved;
    load().then(showApp).catch(() => { sessionStorage.removeItem('adminTok'); token = ''; });
  }
}
setInterval(() => { if (!$('#app').hidden && !document.body.classList.contains('busy') && !cfm.open && !rec.open && location.hash !== '#setting') safeLoad(); }, 30000);
</script>
