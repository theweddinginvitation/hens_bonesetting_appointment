<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Hen's Bone Setting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand:#1f2a44; --brand-deep:#141c30; --brand-soft:#e6e9f2;
    --green:#23895a; --green-deep:#186b45;
    --taken:#9b3a4d;
    --paper:#f6f2ec; --surface:#fff; --ink:#1b2233; --muted:#667085; --line:#e5dfd6;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); line-height:1.45; }
  body.busy { cursor:progress; }
  body.busy button { pointer-events:none; opacity:.6; }
  button, input { font:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid #9fb0e0; outline-offset:2px; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 16px; }

  /* login */
  .login-page { min-height:100vh; background:var(--brand); display:grid; place-items:center; padding:20px; }
  .login { width:min(380px,100%); background:var(--surface); border-radius:22px; padding:28px 24px 24px; box-shadow:0 30px 80px rgba(10,15,35,.4); }
  .login .brand { margin:0 0 2px; font-family:var(--display); font-weight:700; font-size:15px; color:var(--muted); }
  .login h1 { margin:0 0 18px; font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.02em; color:var(--brand); }
  label { display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
  .login input { width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; font-size:16px; background:#fff; color:var(--ink); }
  .login input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  #lerr { color:#b3001b; font-size:13.5px; min-height:20px; margin:8px 0 0; }
  .btn { border:0; border-radius:12px; padding:13px 20px; font-weight:700; font-size:16px; }
  .btn.primary { background:var(--brand); color:#fff; }
  .btn.primary:hover { background:var(--brand-deep); }
  .btn.ghost { background:var(--brand-soft); color:var(--brand); }
  .btn.ghost:hover { background:#d4daeb; }
  .login .btn { width:100%; margin-top:8px; }

  /* header */
  .hero { background:var(--brand); color:#fff; padding:20px 0 18px; border-radius:0 0 28px 28px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:10px; margin-bottom:14px; border-bottom:1px solid rgba(255,255,255,.22); }
  .top b { font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.005em; }
  .top b small { font-family:var(--body); font-weight:600; font-size:12px; background:rgba(255,255,255,.16); padding:3px 9px; border-radius:20px; margin-left:8px; vertical-align:2px; }
  .pill { border:0; border-radius:10px; padding:8px 14px; background:rgba(255,255,255,.14); color:#fff; font-weight:600; font-size:14px; }
  .pill:hover { background:rgba(255,255,255,.26); }
  .row2 { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; justify-content:space-between; }
  .row2 h1 { margin:0; font-family:var(--display); font-weight:800; font-size:clamp(26px,5vw,36px); line-height:1.05; letter-spacing:-.02em; }
  .nav { display:flex; align-items:center; gap:8px; }
  #range { font-weight:600; font-size:14px; min-width:150px; text-align:center; color:#c5cbe0; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.12); border-radius:12px; padding:7px 12px; font-size:13.5px; font-weight:600; }
  .chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .chip .c-p { background:#f6c453; } .chip .c-a { background:#86d6ae; } .chip .c-b { background:#f1a3b0; }
  .chip b { font-family:var(--display); font-size:17px; }

  /* day tabs (small screens) */
  #tabs { display:flex; gap:8px; overflow-x:auto; padding:5px 4px 8px; margin:12px -4px 0; scrollbar-width:none; scroll-snap-type:x proximity; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 66px; scroll-snap-align:start; border:0; border-radius:14px; padding:9px 4px; background:rgba(255,255,255,.12); color:#fff; text-align:center; position:relative; transition:transform .15s, box-shadow .15s; }
  .tab .dn { display:block; font-size:11.5px; font-weight:600; opacity:.85; }
  .tab .dd { display:block; font-family:var(--display); font-weight:800; font-size:24px; line-height:1.1; margin-top:1px; }
  .tab[aria-pressed="true"] { background:#fff; color:var(--brand); transform:translateY(-2px); }
  .tab .np { position:absolute; top:-5px; right:-3px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:#f6c453; color:#3d2a00; font-size:12px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 2px var(--brand); }

  /* week grid (wide screens) */
  main { padding:22px 0 48px; }
  #grid { display:grid; grid-template-columns:62px repeat(7,minmax(150px,1fr)); gap:8px; }
  .dh { padding:8px 6px; text-align:center; border-radius:12px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; }
  .dh b { font-family:var(--display); font-size:16px; }
  .dh span { font-size:12.5px; color:var(--muted); }
  .dh.today { background:var(--brand); color:#fff; border-color:var(--brand); }
  .dh.today span { color:#c5cbe0; }
  .tl { font-family:var(--display); font-weight:700; font-size:14px; color:var(--muted); padding:12px 4px 0 0; text-align:right; }

  /* list (small screens) */
  #list { display:none; }
  .lrow { display:grid; grid-template-columns:54px 1fr; gap:8px; margin-bottom:8px; }

  /* cells + cards */
  .cell { min-height:96px; }
  .cell.past { opacity:.55; }
  .empty { width:100%; height:100%; min-height:96px; border:1.5px dashed #cfc8bb; border-radius:14px; background:transparent; color:var(--muted); font-size:13px; font-weight:600; }
  .empty:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }
  .card { border-radius:14px; padding:10px 12px 11px; border-left:5px solid; background:var(--surface); box-shadow:0 1px 3px rgba(20,28,48,.1); height:100%; }
  .card.Pending { border-color:#f6c453; background:#fdf3d6; }
  .card.Approved { border-color:var(--green); background:#e1f3ea; }
  .card.Disabled { border-color:var(--taken); background:#f5e0e4; }
  .card .nm { font-weight:700; word-break:break-word; }
  .card .nm.none { color:#8a4a58; font-style:italic; font-weight:600; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:5px; }
  .meta a { font-size:13px; font-weight:600; color:var(--brand); text-decoration:none; background:rgba(255,255,255,.7); border-radius:8px; padding:3px 8px; }
  .meta a:hover { background:#fff; text-decoration:underline; }
  .badge { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:20px; background:rgba(20,28,48,.1); }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .acts button { border:0; border-radius:9px; padding:6px 11px; font-size:12.5px; font-weight:700; }
  .b-ap { background:var(--green); color:#fff; } .b-ap:hover { background:var(--green-deep); }
  .b-ca { background:var(--brand-soft); color:var(--brand); } .b-ca:hover { background:#d4daeb; }
  .b-di { background:#f1d3d8; color:#8a2b3c; } .b-di:hover { background:#e8bcc4; }

  @media (max-width:899px) {
    #grid { display:none; }
    #list { display:block; }
    .row2 h1 { width:100%; }
  }
  @media (min-width:900px) {
    #tabs { display:none; }
    main { overflow-x:auto; }
    #grid { min-width:1130px; }
  }

  /* dialog + toast */
  dialog { border:0; padding:0; border-radius:22px; width:min(400px,calc(100% - 32px)); background:var(--surface); color:var(--ink); box-shadow:0 30px 80px rgba(10,15,35,.35); }
  dialog[open] { animation:pop .22s cubic-bezier(.2,.9,.3,1.2); }
  dialog::backdrop { background:rgba(14,18,32,.55); backdrop-filter:blur(3px); }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(8px); } }
  .cbox { padding:24px 22px 22px; }
  .cbox h2 { margin:0 0 8px; font-family:var(--display); font-size:24px; letter-spacing:-.01em; }
  .cbox p { margin:0 0 20px; color:var(--muted); }
  .cbtns { display:flex; gap:10px; }
  .cbtns .btn { flex:1; padding:13px 10px; }
  .btn.danger { background:var(--taken); color:#fff; } .btn.danger:hover { background:#7f2e3e; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--brand-deep); color:#fff; padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s; z-index:20; max-width:calc(100% - 32px); }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <form id="login" class="login">
    <p class="brand">Hen's Bone Setting</p>
    <h1>Admin</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p id="lerr" role="alert"></p>
    <button type="submit" class="btn primary" id="lbtn">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <b>Hen's Bone Setting <small>Admin</small></b>
        <button class="pill" id="logout" type="button">Log out</button>
      </div>
      <div class="row2">
        <h1>Appointments</h1>
        <div class="nav">
          <button class="pill" id="prev" type="button" aria-label="Previous week">‹</button>
          <span id="range"></span>
          <button class="pill" id="next" type="button" aria-label="Next week">›</button>
          <button class="pill" id="todayBtn" type="button">This week</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div id="tabs" role="group" aria-label="Choose day"></div>
    </div>
  </header>
  <main class="wrap">
    <div id="grid"></div>
    <div id="list"></div>
  </main>
</div>

<dialog id="cfm" aria-labelledby="cTitle">
  <div class="cbox">
    <h2 id="cTitle">Cancel appointment?</h2>
    <p id="cMsg"></p>
    <div class="cbtns">
      <button type="button" class="btn ghost" id="cNo">Keep it</button>
      <button type="button" class="btn danger" id="cYes">Cancel it</button>
    </div>
  </div>
</dialog>
<div id="toast"></div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const mq = window.matchMedia('(min-width:900px)');
let token = '', cfg = null, weekStart = '', rows = [], selDay = '';

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  kids.flat().filter(Boolean).forEach(c => e.append(c));
  return e;
}
function parts(ymd) { return ymd.split('-').map(Number); }
function addDays(ymd, n) { const [y, m, d] = parts(ymd); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function localDate(ymd) { const [y, m, d] = parts(ymd); return new Date(y, m - 1, d); }
function md(ymd) { return localDate(ymd).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function dow(ymd) { return localDate(ymd).toLocaleDateString('en-US', { weekday: 'short' }); }
function longDate(ymd) { return localDate(ymd).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); }
function waLink(phone) {
  let d = String(phone).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '62' + d.slice(1);
  return 'https://wa.me/' + d;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ---- api: password is sent only by login(); afterwards a short-lived token is used ---- */
async function api(body) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, token })
  });
  return r.json();
}
function expired(e) { return /session|password/i.test((e && e.message) || ''); }

async function load() {
  const r = await api({ action: 'admin_list', from: weekStart });
  if (!r.ok) throw new Error(r.error);
  cfg = r.config; weekStart = r.from; rows = r.rows;
  const week = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  if (!week.includes(selDay)) selDay = week.includes(cfg.today) ? cfg.today : weekStart;
  render();
}
function safeLoad() {
  return load().catch(e => { if (expired(e)) logout(); else toast(e.message || 'Error'); });
}

/* ---- render ---- */
function render() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  $('#range').textContent = md(weekStart) + ' – ' + md(days[6]) + ', ' + localDate(days[6]).getFullYear();

  const count = s => rows.filter(r => r.status === s).length;
  const st = $('#stats'); st.replaceChildren(
    h('span', { class: 'chip' }, h('i', { class: 'c-p' }), h('b', { text: count('Pending') }), 'pending'),
    h('span', { class: 'chip' }, h('i', { class: 'c-a' }), h('b', { text: count('Approved') }), 'approved'),
    h('span', { class: 'chip' }, h('i', { class: 'c-b' }), h('b', { text: count('Disabled') }), 'blocked'));

  const byKey = new Map(rows.map(r => [r.date + ' ' + r.time, r]));

  const tabs = $('#tabs'); tabs.replaceChildren();
  days.forEach(d => {
    const np = rows.filter(r => r.date === d && r.status === 'Pending').length;
    const b = h('button', { class: 'tab', type: 'button', onclick: () => { selDay = d; render(); } },
      h('span', { class: 'dn', text: d === cfg.today ? 'Today' : dow(d) }),
      h('span', { class: 'dd', text: localDate(d).getDate() }),
      np ? h('span', { class: 'np', text: np }) : null);
    b.setAttribute('aria-pressed', d === selDay);
    tabs.append(b);
  });

  const g = $('#grid'); g.replaceChildren();
  const list = $('#list'); list.replaceChildren();
  if (mq.matches) {
    g.append(h('div'));
    days.forEach(d => g.append(h('div', { class: 'dh' + (d === cfg.today ? ' today' : '') },
      h('b', { text: dow(d) }), h('span', { text: md(d) }))));
    cfg.times.forEach(t => {
      g.append(h('div', { class: 'tl', text: t }));
      days.forEach(d => g.append(cell(d, t, byKey.get(d + ' ' + t))));
    });
  } else {
    list.append(h('p', { text: longDate(selDay), style: 'margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:20px;' }));
    cfg.times.forEach(t => list.append(h('div', { class: 'lrow' },
      h('div', { class: 'tl', text: t }), cell(selDay, t, byKey.get(selDay + ' ' + t)))));
  }
}

function cell(d, t, r) {
  const past = (d + ' ' + t) <= cfg.now;
  const c = h('div', { class: 'cell' + (past ? ' past' : '') });
  if (!r) {
    c.append(h('button', { class: 'empty', type: 'button', text: 'Open · Disable',
      onclick: () => act({ action: 'disable', date: d, time: t }, 'Slot disabled.') }));
    return c;
  }
  const named = !!r.name;
  const acts = h('div', { class: 'acts' });
  if (named && r.status !== 'Approved') acts.append(h('button', { class: 'b-ap', type: 'button', text: 'Approve',
    onclick: () => act({ action: 'update', id: r.id, status: 'Approved' }, 'Approved.') }));
  acts.append(h('button', { class: 'b-ca', type: 'button', text: named ? 'Cancel' : 'Unblock',
    onclick: () => {
      const go = () => act({ action: 'update', id: r.id, status: 'Cancelled' }, 'Slot available again.');
      if (!named) return go();
      confirmBox('Cancel appointment?', r.name + ' · ' + longDate(d) + ', ' + t + '. The slot becomes available again.', go);
    } }));
  if (named && r.status !== 'Disabled') acts.append(h('button', { class: 'b-di', type: 'button', text: 'Disable',
    onclick: () => act({ action: 'update', id: r.id, status: 'Disabled' }, 'Slot disabled.') }));
  const meta = h('div', { class: 'meta' },
    r.phone ? h('a', { href: 'tel:' + r.phone, text: r.phone }) : null,
    r.phone ? h('a', { href: waLink(r.phone), target: '_blank', rel: 'noopener', text: 'WhatsApp' }) : null,
    h('span', { class: 'badge', text: r.status }));
  c.append(h('div', { class: 'card ' + r.status },
    h('div', { class: 'nm' + (named ? '' : ' none'), text: named ? r.name : 'Blocked slot' }),
    meta, acts));
  return c;
}

/* ---- confirm dialog ---- */
const cfm = $('#cfm');
let onYes = null;
function confirmBox(title, msg, yes) {
  $('#cTitle').textContent = title; $('#cMsg').textContent = msg; onYes = yes; cfm.showModal();
}
$('#cNo').onclick = () => cfm.close();
$('#cYes').onclick = () => { const f = onYes; cfm.close(); if (f) f(); };
cfm.addEventListener('click', e => { if (e.target === cfm) cfm.close(); });

async function act(payload, okMsg) {
  document.body.classList.add('busy');
  try {
    const r = await api(payload);
    if (!r.ok) throw new Error(r.error);
    await load();
    toast(okMsg);
  } catch (e) {
    if (expired(e)) { logout(); return; }
    toast(e.message || 'Error'); try { await load(); } catch (_) {}
  } finally {
    document.body.classList.remove('busy');
  }
}

/* ---- session ---- */
function showApp() { $('#loginPage').hidden = true; $('#app').hidden = false; }
function logout() { sessionStorage.removeItem('adminTok'); token = ''; location.reload(); }

async function signIn(pw) {
  const r = await api({ action: 'login', password: pw });
  if (!r.ok) throw new Error(r.error);
  token = r.token;
  await load();
  sessionStorage.setItem('adminTok', token);
  showApp();
}

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw'), btn = $('#lbtn');
  $('#lerr').textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  try { await signIn(pw.value); }
  catch (err) { $('#lerr').textContent = err.message || 'Login failed.'; token = ''; }
  finally { pw.value = ''; btn.disabled = false; btn.textContent = 'Sign in'; }
});
$('#prev').onclick = () => { weekStart = addDays(weekStart, -7); safeLoad(); };
$('#next').onclick = () => { weekStart = addDays(weekStart, 7); safeLoad(); };
$('#todayBtn').onclick = () => { weekStart = ''; selDay = ''; safeLoad(); };
$('#logout').onclick = logout;
mq.addEventListener('change', () => { if (cfg) render(); });

if (!API_URL || API_URL.startsWith('PASTE')) {
  $('#lerr').textContent = 'Set API_URL in config.js first.';
} else {
  const saved = sessionStorage.getItem('adminTok');
  if (saved) {
    token = saved;
    load().then(showApp).catch(() => { sessionStorage.removeItem('adminTok'); token = ''; });
  }
}
setInterval(() => { if (!$('#app').hidden && !document.body.classList.contains('busy') && !cfm.open) safeLoad(); }, 30000);
</script>
</body>
</html>
