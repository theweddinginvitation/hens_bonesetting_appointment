<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f2f7">
<title>Admin – Hen's Bone Setting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(60,60,67,.16);
    --blue:#007aff; --blue-deep:#0062d6; --blue-soft:rgba(0,122,255,.12);
    --ok:#007aff;
    --paper:#f2f2f7; --surface:#fff; --chip:rgba(120,120,128,.12);
    --ring:0 0 0 .5px rgba(0,0,0,.08);
    --lift:0 12px 32px rgba(0,0,0,.14);
    --glass:rgba(255,255,255,.72);
    --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
    /* iOS sheet curve, and a light spring (about 4% overshoot) */
    --ease:cubic-bezier(.32,.72,0,1);
    --spring:cubic-bezier(.34,1.3,.64,1);
  }
  @supports (transition-timing-function:linear(0,1)) {
    :root { --spring:linear(0,.0029,.0116 2%,.0463 4.1%,.105 6.2%,.2437 9.5%,.4663 13.9%,.6692 18.1%,.8329 22.5%,.9381 27.2%,1.0022 32.6%,1.0313 38.4%,1.0376 44.4%,1.0266 52.3%,1.0085 62.4%,1.0006 72%,.998 84%,1); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; scrollbar-gutter:stable; }
  html:has(dialog[open]) { overflow:hidden; }
  body { margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); line-height:1.4; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; font-optical-sizing:auto; }
  body.busy { cursor:progress; }
  body.busy button { pointer-events:none; }
  body.busy::after, body.syncing::after { content:""; position:fixed; top:0; left:0; right:0; height:3px; z-index:40; pointer-events:none; background:linear-gradient(90deg,transparent,var(--blue),transparent) no-repeat; background-size:40% 100%; animation:bar 1s linear infinite; }
  @keyframes bar { from { background-position:-40% 0; } to { background-position:140% 0; } }
  button, input { font:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid rgba(0,122,255,.55); outline-offset:2px; }
  .wrap { max-width:1280px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
  @keyframes rise { from { opacity:0; transform:translate3d(0,14px,0); } }

  /* login */
  .login-page { min-height:100vh; min-height:100dvh; background:var(--paper); background-image:radial-gradient(60% 360px at 15% 0, rgba(0,122,255,.16), transparent 70%), radial-gradient(50% 320px at 100% 100%, rgba(175,130,255,.1), transparent 70%); background-repeat:no-repeat; display:grid; place-items:center; padding:20px; }
  .login { width:min(380px,100%); background:rgba(255,255,255,.82); -webkit-backdrop-filter:saturate(180%) blur(30px); backdrop-filter:saturate(180%) blur(30px); border-radius:28px; padding:30px 24px 24px; box-shadow:0 0 0 .5px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14); animation:pop .8s var(--spring) backwards; }
  .login .brand { margin:0 0 2px; font-weight:600; font-size:14px; color:var(--muted); }
  .login h1 { margin:0 0 20px; font-family:var(--display); font-weight:700; font-size:34px; letter-spacing:-.026em; }
  label { display:block; font-weight:600; font-size:13px; color:var(--muted); margin:0 0 6px 4px; }
  .login input { width:100%; padding:14px 16px; border:0; border-radius:14px; font-size:17px; letter-spacing:-.015em; background:rgba(120,120,128,.12); color:var(--ink); transition:background .2s, box-shadow .3s var(--ease); }
  .login input:focus { outline:none; background:#fff; box-shadow:0 0 0 3.5px rgba(0,122,255,.4); }
  #lerr { color:#d1322b; font-size:13.5px; min-height:20px; margin:8px 0 0 4px; }
  .btn { border:0; border-radius:14px; padding:14px 20px; font-weight:600; font-size:17px; letter-spacing:-.015em; transition:transform .5s var(--spring), background .2s, opacity .2s; }
  .btn:active { transform:scale(.97); transition-duration:.1s; }
  .btn:disabled { opacity:.6; }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.primary:hover { background:var(--blue-deep); }
  .btn.ghost { background:var(--chip); color:var(--blue); }
  .btn.ghost:hover { background:rgba(120,120,128,.2); }
  .login .btn { width:100%; margin-top:8px; }

  /* header */
  .hero { background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px); color:var(--ink); padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px; box-shadow:0 .5px 0 var(--line); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; margin-bottom:14px; box-shadow:0 .5px 0 var(--line); }
  .top b { font-family:var(--display); font-weight:600; font-size:17px; letter-spacing:-.022em; }
  .topbtns { display:flex; gap:8px; }
  .top b.tb { display:flex; align-items:center; gap:10px; min-width:0; }
  .logo { flex:none; width:32px; height:32px; border-radius:10px; background:linear-gradient(180deg,#4da3ff,#007aff); color:#fff; display:grid; place-items:center; box-shadow:inset 0 .5px 0 rgba(255,255,255,.5), 0 2px 6px rgba(0,122,255,.35); }
  .logo svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .top b small { font-weight:600; font-size:12px; background:var(--blue-soft); color:var(--blue); padding:3px 9px; border-radius:20px; margin-left:8px; vertical-align:1px; }
  .pill { border:0; border-radius:999px; padding:8px 15px; background:var(--chip); color:var(--blue); font-weight:600; font-size:14px; letter-spacing:-.01em; transition:background .2s, transform .5s var(--spring); }
  .pill:hover { background:rgba(120,120,128,.2); }
  .pill:active { transform:scale(.93); transition-duration:.1s; }
  .row2 { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; justify-content:space-between; }
  .row2 h1 { margin:0; font-family:var(--display); font-weight:700; font-size:clamp(28px,6vw,34px); line-height:1.1; letter-spacing:-.026em; }
  .nav { display:flex; align-items:center; gap:8px; }
  #range { font-weight:600; font-size:14px; min-width:150px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { display:inline-flex; align-items:center; gap:7px; background:var(--surface); color:var(--ink); border:0; border-radius:999px; padding:7px 14px 7px 12px; font-size:13.5px; font-weight:600; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.06); transition:transform .5s var(--spring), box-shadow .3s var(--ease); }
  .chip:hover { box-shadow:0 6px 16px rgba(0,0,0,.1), 0 0 0 .5px rgba(0,0,0,.06); }
  .chip:active { transform:scale(.94); transition-duration:.1s; }
  .chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .chip .c-p { background:#ff9f0a; } .chip .c-a { background:var(--ok); } .chip .c-b { background:#98a4b3; }
  .chip b { font-family:var(--display); font-size:16px; font-variant-numeric:tabular-nums; }

  /* day tabs (small screens) */
  #tabs { display:flex; gap:8px; overflow-x:auto; padding:10px 6px 12px; margin:6px -6px 0; scroll-padding-inline:6px; scrollbar-width:none; scroll-snap-type:x proximity; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 66px; scroll-snap-align:start; border:0; border-radius:20px; padding:10px 4px; background:var(--surface); color:var(--ink); text-align:center; position:relative; box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.05); transition:transform .55s var(--spring), box-shadow .3s var(--ease), background .3s var(--ease), color .3s var(--ease); }
  .tab .dn { display:block; font-size:11.5px; font-weight:600; color:var(--muted); transition:color .3s var(--ease); }
  .tab .dd { display:block; font-family:var(--display); font-weight:700; font-size:24px; line-height:1.1; margin-top:1px; letter-spacing:-.025em; }
  .tab:active { transform:scale(.94); transition-duration:.1s; }
  .tab[aria-pressed="true"] { background:var(--blue); color:#fff; transform:translateY(-3px) scale(1.04); box-shadow:0 10px 22px rgba(0,122,255,.36); }
  .tab[aria-pressed="true"] .dn { color:rgba(255,255,255,.88); }
  .tab .np { position:absolute; top:-6px; right:-3px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:#ff9f0a; color:#3d2a00; font-size:12px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 2px var(--paper); }

  /* week grid (wide screens) */
  main.wrap { padding-top:22px; padding-bottom:16px; }
  .fnav { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:15; display:grid; grid-template-columns:1fr 1fr; padding:5px; border-radius:999px; background:rgba(255,255,255,.7); -webkit-backdrop-filter:saturate(200%) blur(26px); backdrop-filter:saturate(200%) blur(26px); box-shadow:0 0 0 .5px rgba(0,0,0,.1), inset 0 .5px 0 rgba(255,255,255,.9), 0 12px 34px rgba(0,0,0,.16); touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab; animation:dockIn .9s var(--spring) .1s backwards; }
  @keyframes dockIn { from { opacity:0; transform:translate(-50%,30px) scale(.92); } }
  .fnav.drag { cursor:grabbing; }
  .fnav .thumb { position:absolute; top:5px; bottom:5px; left:5px; width:calc((100% - 10px) / 2); border-radius:999px; background:rgba(0,122,255,.14); box-shadow:inset 0 .5px 0 rgba(255,255,255,.7), inset 0 0 0 .5px rgba(0,122,255,.12); transition:transform .65s var(--spring); will-change:transform; }
  .fnav.drag .thumb { transition:none; }
  .fnav button { position:relative; z-index:1; display:inline-flex; align-items:center; justify-content:center; gap:7px; border:0; background:transparent; color:var(--muted); font-weight:600; font-size:14px; letter-spacing:-.01em; padding:11px 22px; border-radius:999px; white-space:nowrap; touch-action:manipulation; transition:color .35s var(--ease); }
  .fnav button svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .55s var(--spring); }
  .fnav button:active svg { transform:scale(.86); transition-duration:.1s; }
  @media (hover:hover) { .fnav button:not([aria-current="page"]):hover { color:var(--ink); } }
  .fnav button[aria-current="page"] { color:var(--blue); }
  .pg-in { animation:pgIn .7s var(--ease); }
  @keyframes pgIn { from { opacity:0; transform:translate3d(var(--dx,0),10px,0); } }
  .foot { background:transparent; color:var(--muted); text-align:center; font-size:13px; font-weight:500; padding:20px 16px; box-shadow:inset 0 .5px 0 var(--line); }
  .foot-pad { background:transparent; height:calc(72px + env(safe-area-inset-bottom,0px)); }   /* room for the floating nav, same colour as the footer */
  #grid { display:grid; grid-template-columns:62px repeat(7,minmax(150px,1fr)); gap:8px; }
  .dh { padding:9px 6px; text-align:center; border-radius:16px; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.05); display:flex; flex-direction:column; }
  .dh b { font-family:var(--display); font-size:15px; letter-spacing:-.015em; }
  .dh span { font-size:12.5px; color:var(--muted); }
  .dh.today { background:var(--blue); color:#fff; box-shadow:0 8px 20px rgba(0,122,255,.32); }
  .dh.today span { color:rgba(255,255,255,.85); }
  .tl { font-weight:600; font-size:13px; color:var(--muted); padding:12px 4px 0 0; text-align:right; font-variant-numeric:tabular-nums; }

  /* list (small screens) */
  #list { display:none; }
  .lrow { display:grid; grid-template-columns:54px 1fr; gap:8px; margin-bottom:8px; }

  /* cells + cards */
  .cell { min-height:96px; }
  .cell.past { opacity:.5; }
  .empty { width:100%; height:100%; min-height:96px; border:0; border-radius:18px; background:rgba(120,120,128,.08); color:var(--muted); font-size:13px; font-weight:600; transition:background .25s var(--ease), color .25s var(--ease), transform .5s var(--spring); }
  .empty:hover { background:var(--blue-soft); color:var(--blue); }
  .empty:active { transform:scale(.96); transition-duration:.1s; }
  .empty:disabled, .empty:disabled:hover { cursor:not-allowed; background:rgba(120,120,128,.06); color:var(--muted); transform:none; }
  .card.cardbtn { display:block; width:100%; text-align:left; font:inherit; color:var(--ink); border:0; cursor:pointer; transition:background .25s var(--ease), transform .5s var(--spring); }
  .card.cardbtn:hover { background:rgba(120,120,128,.22); }
  .card.cardbtn:active { transform:scale(.97); transition-duration:.1s; }
  .card.cardbtn:disabled { cursor:not-allowed; }
  .hint { font-size:12.5px; font-weight:600; color:var(--muted); margin-top:4px; }
  .acts button:disabled { cursor:not-allowed; opacity:.5; }
  .card { border-radius:18px; padding:11px 13px 12px; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.04), 0 0 0 .5px rgba(0,0,0,.05); height:100%; }
  .card.Pending { background:#fff3d6; box-shadow:inset 4px 0 0 #ff9f0a; }
  .card.Approved { background:#e2efff; box-shadow:inset 4px 0 0 var(--ok); }
  .card.Disabled { background:rgba(120,120,128,.14); box-shadow:inset 4px 0 0 #98a4b3; }
  .card .nm { font-weight:600; letter-spacing:-.01em; word-break:break-word; }
  .card .nm.none { color:var(--muted); font-style:italic; font-weight:600; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:6px; }
  .meta a { font-size:13px; font-weight:600; color:var(--blue); text-decoration:none; background:rgba(255,255,255,.75); border-radius:999px; padding:3px 10px; transition:background .2s, transform .5s var(--spring); }
  .meta a:hover { background:#fff; }
  .meta a:active { transform:scale(.94); transition-duration:.1s; }
  .badge { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:20px; background:rgba(0,0,0,.07); color:var(--muted); }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .acts button { border:0; border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; letter-spacing:-.005em; transition:background .2s, transform .5s var(--spring); }
  .acts button:active:not(:disabled) { transform:scale(.93); transition-duration:.1s; }
  .b-ap { background:var(--ok); color:#fff; } .b-ap:hover { background:var(--blue-deep); }
  .b-ca { background:#fff; color:var(--ink); box-shadow:0 0 0 .5px rgba(0,0,0,.1); } .b-ca:hover { background:#f2f2f7; }
  .b-di { background:#fdeeed; color:#d1322b; } .b-di:hover { background:#fbdcda; }

  @media (max-width:899px) {
    #grid { display:none; }
    #list { display:block; }
    .row2 h1 { width:100%; }
  }
  @media (min-width:900px) {
    #tabs { display:none; }
    main { overflow-x:auto; }
    #grid { min-width:1130px; }
  }

  /* dialog + toast: glass sheets, bottom sheet on phones, spring-in alert on wide screens */
  dialog { border:0; padding:0; border-radius:28px; width:min(400px,calc(100% - 32px)); max-height:calc(100% - 32px); max-height:calc(100dvh - 32px); overflow:auto; overscroll-behavior:contain; background:rgba(250,250,252,.92); -webkit-backdrop-filter:saturate(180%) blur(30px); backdrop-filter:saturate(180%) blur(30px); color:var(--ink); box-shadow:0 0 0 .5px rgba(0,0,0,.1), 0 30px 80px rgba(0,0,0,.3);
    opacity:0; transform:translateY(18px) scale(.95);
    transition:opacity .3s var(--ease), transform .6s var(--spring), overlay .6s allow-discrete, display .6s allow-discrete; }
  dialog[open] { opacity:1; transform:none; }
  @starting-style { dialog[open] { opacity:0; transform:translateY(18px) scale(.95); } }
  dialog::backdrop { background:rgba(0,0,0,0); -webkit-backdrop-filter:blur(0); backdrop-filter:blur(0); transition:background .45s var(--ease), backdrop-filter .45s var(--ease), overlay .45s allow-discrete, display .45s allow-discrete; }
  dialog[open]::backdrop { background:rgba(0,0,0,.32); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  @starting-style { dialog[open]::backdrop { background:rgba(0,0,0,0); -webkit-backdrop-filter:blur(0); backdrop-filter:blur(0); } }
  @supports not (transition-behavior:allow-discrete) {
    dialog[open] { animation:pop .45s var(--spring); }
    dialog[open]::backdrop { animation:fade .3s; }
  }
  @keyframes pop { from { opacity:0; transform:translateY(18px) scale(.95); } }
  @keyframes fade { from { opacity:0; } }
  @media (max-width:639px) {
    dialog#rec { width:100%; max-width:none; margin:auto 0 0; border-radius:30px 30px 0 0; max-height:88dvh; padding-bottom:env(safe-area-inset-bottom,0px); transform:translateY(100%); transition:opacity .25s var(--ease), transform .55s var(--ease), overlay .55s allow-discrete, display .55s allow-discrete; }
    dialog#rec[open] { transform:none; }
    dialog#rec .cbox::before { content:""; position:absolute; top:8px; left:50%; width:38px; height:5px; margin-left:-19px; border-radius:3px; background:rgba(60,60,67,.3); }
    dialog#rec .cbox { padding-top:30px; }
  }
  @media (max-width:639px) { @starting-style { dialog#rec[open] { opacity:1; transform:translateY(100%); } } }
  .cbox { padding:24px 22px 22px; position:relative; }
  .cbox h2 { margin:0 0 8px; font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:-.024em; }
  .cbox p { margin:0 0 20px; color:var(--muted); }
  .cbtns { display:flex; gap:10px; }
  .cbtns .btn { flex:1; padding:13px 10px; font-size:16px; }
  .cbox p.sub { margin:0 0 10px; font-size:13.5px; }
  .rlist { max-height:50vh; overflow:auto; margin:0 -6px 16px; padding:0 6px 2px; }
  .rrow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px; border-radius:16px; cursor:pointer; transition:background .2s, transform .5s var(--spring); }
  .rrow + .rrow { box-shadow:0 -.5px 0 var(--line); }
  .rrow:hover { background:rgba(120,120,128,.1); }
  .rrow:active { transform:scale(.98); transition-duration:.1s; }
  .rrow .when { font-size:12.5px; font-weight:600; color:var(--muted); }
  .rrow .who { font-weight:600; letter-spacing:-.01em; word-break:break-word; }
  .rrow .ph { font-size:13px; color:var(--muted); }
  .rrow button { border:0; border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; background:var(--ok); color:#fff; flex:none; transition:transform .5s var(--spring); }
  .rrow button:active { transform:scale(.92); transition-duration:.1s; }
  .rempty { padding:14px 12px; color:var(--muted); }
  .plist { max-height:50vh; overflow:auto; margin:0 -6px 14px; padding:0 6px; }
  .prow { display:grid; grid-template-columns:104px 1fr; gap:12px; align-items:center; padding:10px 0; }
  .prow + .prow { box-shadow:0 -.5px 0 var(--line); }
  .prow img { width:104px; aspect-ratio:16/9; object-fit:cover; border-radius:14px; background:#e5e5ea; display:block; box-shadow:0 0 0 .5px rgba(0,0,0,.08); }
  .pbtns { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .pbtns .n { font-weight:700; font-size:13px; color:var(--muted); margin-right:4px; font-variant-numeric:tabular-nums; }
  .pbtns button { border:0; border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; background:var(--chip); color:var(--blue); transition:background .2s, transform .5s var(--spring); }
  .pbtns button:hover:not(:disabled) { background:rgba(120,120,128,.2); }
  .pbtns button:active:not(:disabled) { transform:scale(.92); transition-duration:.1s; }
  .pbtns button:disabled { opacity:.35; cursor:not-allowed; }
  .pbtns .del { background:#fdeeed; color:#d1322b; } .pbtns .del:hover:not(:disabled) { background:#fbdcda; }
  .pempty { padding:14px 2px; color:var(--muted); }
  .padd { display:flex; gap:10px; margin-bottom:14px; }
  .padd .btn { flex:1; }
  #setMain { max-width:720px; }
  .sh { margin:0 0 18px; font-family:var(--display); font-weight:700; font-size:clamp(28px,6vw,34px); letter-spacing:-.026em; }
  .panel { background:var(--surface); border-radius:24px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 0 0 .5px rgba(0,0,0,.05); padding:20px; margin-bottom:16px; }
  .panel h2 { margin:0 0 4px; font-family:var(--display); font-size:20px; font-weight:700; letter-spacing:-.022em; }
  .hint2 { margin:0 0 14px; color:var(--muted); font-size:13.5px; }
  .seg { position:relative; display:inline-grid; grid-template-columns:1fr 1fr; background:var(--chip); border-radius:999px; padding:4px; }
  .seg .sthumb { position:absolute; top:4px; bottom:4px; left:4px; width:calc((100% - 8px) / 2); border-radius:999px; background:var(--blue); box-shadow:0 4px 12px rgba(0,122,255,.35);
    transition:transform .65s var(--spring), background .4s var(--ease), box-shadow .4s var(--ease); will-change:transform; }
  .seg[data-on="0"] .sthumb { transform:translateX(100%); background:#fff; box-shadow:0 0 0 .5px rgba(0,0,0,.08), 0 3px 10px rgba(0,0,0,.14); }
  .seg button { position:relative; z-index:1; border:0; background:transparent; border-radius:999px; padding:10px 24px; font-weight:600; font-size:14px; color:var(--muted); touch-action:manipulation; transition:color .35s var(--ease); }
  .seg button[aria-pressed="true"].on { color:#fff; }

  .panel.off #pList { opacity:.5; }

  .frow { display:flex; gap:10px; }
  .frow input { flex:1; min-width:0; padding:13px 16px; border:0; border-radius:14px; font-size:17px; letter-spacing:-.015em; background:rgba(120,120,128,.12); color:var(--ink); transition:background .2s, box-shadow .3s var(--ease); }
  .frow input::placeholder { color:#9a9aa1; }

  .btn.danger { background:#ff3b30; color:#fff; } .btn.danger:hover { background:#d1322b; }
  #toast { position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(14px) scale(.96); background:rgba(29,29,31,.86); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); color:#fff; padding:12px 20px; border-radius:999px; font-size:14px; font-weight:600; letter-spacing:-.01em; opacity:0; pointer-events:none; transition:opacity .3s var(--ease), transform .6s var(--spring); z-index:50; max-width:calc(100% - 32px); box-shadow:0 10px 30px rgba(0,0,0,.25); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  @media (prefers-reduced-transparency:reduce) {
    .hero, dialog, .fnav, .login, #toast { -webkit-backdrop-filter:none; backdrop-filter:none; }
    .hero, dialog, .login { background:#fff; }
    .fnav { background:#fff; }
  }
</style>
</head>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const mq = window.matchMedia('(min-width:900px)');
let token = '', cfg = null, weekStart = '', rows = [], selDay = '';

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  kids.flat().filter(Boolean).forEach(c => e.append(c));
  return e;
}
function parts(ymd) { return ymd.split('-').map(Number); }
function addDays(ymd, n) { const [y, m, d] = parts(ymd); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function localDate(ymd) { const [y, m, d] = parts(ymd); return new Date(y, m - 1, d); }
function md(ymd) { return localDate(ymd).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function dow(ymd) { return localDate(ymd).toLocaleDateString('en-US', { weekday: 'short' }); }
function longDate(ymd) { return localDate(ymd).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); }
function waLink(phone) {
  let d = String(phone).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '62' + d.slice(1);
  return 'https://wa.me/' + d;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ---- api: password is sent only by login(); afterwards a short-lived token is used ---- */
async function api(body) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, token })
  });
  return r.json();
}
function expired(e) { return /session|password/i.test((e && e.message) || ''); }

async function load() {
  const r = await api({ action: 'admin_list', from: weekStart });
  if (!r.ok) throw new Error(r.error);
  cfg = r.config; weekStart = r.from; rows = r.rows;
  const week = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  if (!week.includes(selDay)) selDay = week.includes(cfg.today) ? cfg.today : weekStart;
  render();
}
function safeLoad() {
  return load().catch(e => { if (expired(e)) logout(); else toast(e.message || 'Error'); });
}

/* ---- render ---- */
let lastSig = '';
function centerTab() {
  const tabs = $('#tabs'), b = tabs.querySelector('[aria-pressed="true"]');
  if (b) tabs.scrollTo({ left: b.offsetLeft - (tabs.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
}
function render() {
  const sig = JSON.stringify([weekStart, selDay, cfg.now, mq.matches, rows]);
  if (sig === lastSig) return;                       // nothing changed: touch nothing
  lastSig = sig;
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  $('#range').textContent = md(weekStart) + ' – ' + md(days[6]) + ', ' + localDate(days[6]).getFullYear();

  const count = s => rows.filter(r => r.status === s).length;
  const st = $('#stats'); st.replaceChildren(
    h('button', { class: 'chip', type: 'button', onclick: () => showRecords('Pending') }, h('i', { class: 'c-p' }), h('b', { text: count('Pending') }), 'pending'),
    h('button', { class: 'chip', type: 'button', onclick: () => showRecords('Approved') }, h('i', { class: 'c-a' }), h('b', { text: count('Approved') }), 'approved'));

  const byKey = new Map(rows.map(r => [r.date + ' ' + r.time, r]));

  const tabs = $('#tabs'), keepX = tabs.scrollLeft; tabs.replaceChildren();
  days.forEach(d => {
    const np = rows.filter(r => r.date === d && r.status === 'Pending').length;
    const b = h('button', { class: 'tab', type: 'button', onclick: () => { selDay = d; render(); centerTab(); } },
      h('span', { class: 'dn', text: d === cfg.today ? 'Today' : dow(d) }),
      h('span', { class: 'dd', text: localDate(d).getDate() }),
      np ? h('span', { class: 'np', text: np }) : null);
    b.setAttribute('aria-pressed', d === selDay);
    tabs.append(b);
  });
  tabs.scrollLeft = keepX;

  const g = $('#grid'); g.replaceChildren();
  const list = $('#list'); list.replaceChildren();
  if (mq.matches) {
    g.append(h('div'));
    days.forEach(d => g.append(h('div', { class: 'dh' + (d === cfg.today ? ' today' : '') },
      h('b', { text: dow(d) }), h('span', { text: md(d) }))));
    cfg.times.forEach(t => {
      g.append(h('div', { class: 'tl', text: t }));
      days.forEach(d => g.append(cell(d, t, byKey.get(d + ' ' + t))));
    });
  } else {
    list.append(h('p', { text: longDate(selDay), style: 'margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:20px;' }));
    cfg.times.forEach(t => list.append(h('div', { class: 'lrow' },
      h('div', { class: 'tl', text: t }), cell(selDay, t, byKey.get(selDay + ' ' + t)))));
  }
}

function cell(d, t, r) {
  const past = (d + ' ' + t) <= cfg.now;
  const c = h('div', { class: 'cell' + (past ? ' past' : '') });
  if (!r) {
    c.append(h('button', { class: 'empty', type: 'button', text: 'Click to Block', disabled: past,
      onclick: () => act({ action: 'disable', date: d, time: t }, 'Slot blocked.') }));
    return c;
  }
  const named = !!r.name;
  if (!named) { // blocked slot: the whole card is the unblock button
    c.append(h('button', { class: 'card Disabled cardbtn', type: 'button', disabled: past || !!r.tmp,
      onclick: () => act({ action: 'update', id: r.id, status: 'Cancelled' }, 'Slot unblocked.') },
      h('div', { class: 'nm none', text: 'Blocked' }),
      h('div', { class: 'hint', text: 'Click to Unblock' })));
    return c;
  }
  const acts = h('div', { class: 'acts' });
  if (r.status !== 'Approved') acts.append(h('button', { class: 'b-ap', type: 'button', text: 'Approve', disabled: past,
    onclick: () => act({ action: 'update', id: r.id, status: 'Approved' }, 'Approved.') }));
  acts.append(h('button', { class: 'b-ca', type: 'button', text: 'Cancel', disabled: past,
    onclick: () => confirmBox('Cancel appointment?', r.name + ' · ' + longDate(d) + ', ' + t + '. The slot becomes available again.',
      () => act({ action: 'update', id: r.id, status: 'Cancelled' }, 'Slot available again.')) }));
  const meta = h('div', { class: 'meta' },
    r.phone ? h('a', { href: 'tel:' + r.phone, text: r.phone }) : null,
    r.phone ? h('a', { href: waLink(r.phone), target: '_blank', rel: 'noopener', text: 'WhatsApp' }) : null,
    h('span', { class: 'badge', text: r.status }));
  c.append(h('div', { class: 'card ' + r.status },
    h('div', { class: 'nm', text: r.name }),
    meta, acts));
  return c;
}

/* ---- records dialog (tap a counter) ---- */
const rec = $('#rec');
function showRecords(status) {
  const list = rows.filter(r => r.status === status && r.name)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  $('#rTitle').textContent = (status === 'Pending' ? 'Pending' : 'Approved') + ' (' + list.length + ')';
  $('#rSub').textContent = md(weekStart) + ' – ' + md(addDays(weekStart, 6)) + ' · tap a record to jump to it';
  const box = $('#rList'); box.replaceChildren();
  if (!list.length) box.append(h('div', { class: 'rempty', text: 'No ' + status.toLowerCase() + ' appointments in this range.' }));
  list.forEach(r => {
    const past = (r.date + ' ' + r.time) <= cfg.now;
    const row = h('div', { class: 'rrow', onclick: () => { selDay = r.date; rec.close(); render(); } },
      h('div', null,
        h('div', { class: 'when', text: dow(r.date) + ', ' + md(r.date) + ' · ' + r.time }),
        h('div', { class: 'who', text: r.name }),
        h('div', { class: 'ph', text: r.phone })));
    if (status === 'Pending' && !past) row.append(h('button', { type: 'button', text: 'Approve',
      onclick: e => { e.stopPropagation(); rec.close(); act({ action: 'update', id: r.id, status: 'Approved' }, 'Approved.'); } }));
    box.append(row);
  });
  rec.showModal();
}
$('#rClose').onclick = () => rec.close();
rec.addEventListener('click', e => { if (e.target === rec) rec.close(); });

/* ---- Setting page: carousel on/off, photos, footer ---- */
let S = { enabled: true, footer: '', images: [], max: 10 };
let queue = Promise.resolve();
const thumbUrl = id => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400';
function fail(e) { if (expired(e)) logout(); else { toast((e && e.message) || 'Error'); loadSettings(); } }
// Quick actions update the screen first and sync in the background, one request at a time.
function sync(payload) { queue = queue.then(() => api(payload)).then(r => { if (!r.ok) throw new Error(r.error); }).catch(fail); return queue; }

async function loadSettings() {
  try {
    const r = await api({ action: 'settings_get' });
    if (!r.ok) throw new Error(r.error);
    S = { enabled: r.carouselEnabled, footer: r.footer, images: r.images, max: r.max || 10 };
    if (document.activeElement !== $('#fText')) $('#fText').value = S.footer;
    showFooter(); renderCarousel();
  } catch (e) { if (expired(e)) logout(); else toast(e.message || 'Error'); }
}
function showFooter() { $('#foot').textContent = S.footer || "Hen's Bone Setting"; }
function renderCarousel() {
  $('#carOn').setAttribute('aria-pressed', S.enabled);
  $('#carOff').setAttribute('aria-pressed', !S.enabled);
  $('#carSeg').dataset.on = S.enabled ? '1' : '0';
  $('#carNote').textContent = S.enabled ? 'Photos are shown at the top of the booking page.' : 'Disabled: the carousel is hidden on the booking page.';
  $('#carPanel').classList.toggle('off', !S.enabled);
  $('#pAdd').disabled = S.images.length >= S.max;
  $('#pAdd').textContent = 'Add photos (' + S.images.length + '/' + S.max + ')';
  const box = $('#pList'); box.replaceChildren();
  if (!S.images.length) box.append(h('div', { class: 'pempty', text: 'No photos yet.' }));
  S.images.forEach((p, i) => box.append(h('div', { class: 'prow' },
    h('img', { src: thumbUrl(p.fileId), alt: 'Photo ' + (i + 1), loading: 'lazy' }),
    h('div', { class: 'pbtns' },
      h('span', { class: 'n', text: '#' + (i + 1) }),
      h('button', { type: 'button', text: '↑', title: 'Move up', disabled: i === 0, onclick: () => movePhoto(i, 'up') }),
      h('button', { type: 'button', text: '↓', title: 'Move down', disabled: i === S.images.length - 1, onclick: () => movePhoto(i, 'down') }),
      h('button', { type: 'button', class: 'del', text: 'Remove', onclick: () => removePhoto(i) })))));
}
function setEnabled(on) {
  if (S.enabled === on) return;
  S.enabled = on; renderCarousel();
  sync({ action: 'settings_set', carouselEnabled: on }).then(() => toast(on ? 'Carousel enabled.' : 'Carousel disabled.'));
}
function movePhoto(i, dir) {
  const j = dir === 'up' ? i - 1 : i + 1;
  if (j < 0 || j >= S.images.length) return;
  const id = S.images[i].id;
  [S.images[i], S.images[j]] = [S.images[j], S.images[i]]; renderCarousel();
  sync({ action: 'carousel_move', id, dir });
}
function removePhoto(i) {
  const p = S.images[i];
  confirmBox('Remove photo?', 'Photo #' + (i + 1) + ' will be removed from the carousel.', () => {
    S.images = S.images.filter(x => x.id !== p.id); renderCarousel();
    sync({ action: 'carousel_delete', id: p.id }).then(() => toast('Photo removed.'));
  });
}
// Resize to max 1600px wide and re-encode as JPEG so uploads stay small and fast on mobile data.
// Decoding and encoding are async, so the page never freezes while a photo is processed.
async function compress(file) {
  const fail = () => new Error('Could not read ' + file.name);
  const draw = (src, w, h) => {
    const scale = Math.min(1, 1600 / w);
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(src, 0, 0, c.width, c.height);
    return new Promise((res, rej) => c.toBlob(b => {
      if (!b) return rej(fail());
      const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fail()); fr.readAsDataURL(b);
    }, 'image/jpeg', 0.82));
  };
  if (window.createImageBitmap) {
    try { const bmp = await createImageBitmap(file); const out = await draw(bmp, bmp.width, bmp.height); if (bmp.close) bmp.close(); return out; } catch (e) {}
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(fail()); im.src = url; });
    return await draw(img, img.naturalWidth, img.naturalHeight);
  } finally { URL.revokeObjectURL(url); }
}
async function uploadFiles(files) {
  const list = Array.from(files).slice(0, S.max - S.images.length);
  if (!list.length) { toast('Maximum ' + S.max + ' photos.'); return; }
  document.body.classList.add('busy');
  try {
    for (let i = 0; i < list.length; i++) {
      toast('Uploading ' + (i + 1) + '/' + list.length + '…');
      const data = await compress(list[i]);
      const r = await api({ action: 'carousel_add', mime: 'image/jpeg', data });
      if (!r.ok) throw new Error(r.error);
    }
    await loadSettings();
    toast(list.length > 1 ? 'Photos added.' : 'Photo added.');
  } catch (e) {
    if (expired(e)) { logout(); return; }
    toast(e.message || 'Upload failed.'); await loadSettings();
  } finally { document.body.classList.remove('busy'); $('#pFile').value = ''; }
}
async function saveFooter() {
  const btn = $('#fSave'); btn.disabled = true;
  try {
    const r = await api({ action: 'settings_set', footer: $('#fText').value });
    if (!r.ok) throw new Error(r.error);
    S.footer = $('#fText').value.trim(); $('#fText').value = S.footer; showFooter();
    toast(S.footer ? 'Footer saved.' : 'Footer reset to default.');
  } catch (e) { if (expired(e)) logout(); else toast(e.message || 'Error'); }
  finally { btn.disabled = false; }
}
$('#carOn').onclick = () => setEnabled(true);
$('#carOff').onclick = () => setEnabled(false);
$('#pAdd').onclick = () => $('#pFile').click();
$('#pFile').onchange = e => uploadFiles(e.target.files);
$('#fSave').onclick = saveFooter;
$('#fText').addEventListener('keydown', e => { if (e.key === 'Enter') saveFooter(); });

/* ---- pages: appointments / setting (#setting) ---- */
let curSet = null;
const nav = $('.fnav'), thumb = $('.fnav .thumb');
const slideThumb = i => { thumb.style.transform = 'translateX(' + (i * 100) + '%)'; };
function applyPage() {
  const set = location.hash === '#setting';
  $('#apptHead').hidden = set; $('#apptMain').hidden = set; $('#setMain').hidden = !set;
  $('#navAppt').setAttribute('aria-current', set ? 'false' : 'page');
  $('#navSet').setAttribute('aria-current', set ? 'page' : 'false');
  slideThumb(set ? 1 : 0);
  window.scrollTo(0, 0);
  if (curSet !== null && curSet !== set) {            // animate only when the page actually changes
    const targets = set ? [$('#setMain')] : [$('#apptHead'), $('#apptMain')];
    targets.forEach(t => {
      t.classList.remove('pg-in'); t.style.setProperty('--dx', (set ? 28 : -28) + 'px');
      void t.offsetWidth; t.classList.add('pg-in');
      t.addEventListener('animationend', () => t.classList.remove('pg-in'), { once: true });
    });
  }
  curSet = set;
  if (set) loadSettings();
}
function goPage(toSet) {
  if ((location.hash === '#setting') === toSet) { slideThumb(toSet ? 1 : 0); return; }
  location.hash = toSet ? '#setting' : '';
}
$('#navAppt').onclick = () => { if (!nav.dataset.moved) goPage(false); };
$('#navSet').onclick = () => { if (!nav.dataset.moved) goPage(true); };

// Swipe (drag) the bar: the blue pill follows your finger and snaps to the nearest page.
let dragX = null, dragStart = 0, dragW = 0, dragOff = 0;
nav.addEventListener('pointerdown', e => {
  dragX = e.clientX; dragW = thumb.offsetWidth; dragStart = location.hash === '#setting' ? dragW : 0; dragOff = dragStart;
  delete nav.dataset.moved;
});
nav.addEventListener('pointermove', e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX;
  if (!nav.classList.contains('drag')) {
    if (Math.abs(dx) < 6) return;
    nav.classList.add('drag'); nav.dataset.moved = '1'; nav.setPointerCapture(e.pointerId);
  }
  dragOff = Math.max(0, Math.min(dragW, dragStart + dx));
  thumb.style.transform = 'translateX(' + dragOff + 'px)';
});
function endDrag(e) {
  if (dragX === null) return;
  const dx = e.clientX - dragX, moved = nav.classList.contains('drag');
  dragX = null; nav.classList.remove('drag');
  if (!moved) return;
  const flick = Math.abs(dx) > dragW * 0.3;            // short flick also switches
  const toSet = flick ? dx > 0 : dragOff > dragW / 2;
  goPage(toSet);
  setTimeout(() => { delete nav.dataset.moved; }, 50);
}
nav.addEventListener('pointerup', endDrag);
nav.addEventListener('pointercancel', endDrag);

window.addEventListener('hashchange', () => { if (!$('#app').hidden) applyPage(); });

/* ---- confirm dialog ---- */
const cfm = $('#cfm');
let onYes = null;
function confirmBox(title, msg, yes) {
  $('#cTitle').textContent = title; $('#cMsg').textContent = msg; onYes = yes; cfm.showModal();
}
$('#cNo').onclick = () => cfm.close();
$('#cYes').onclick = () => { const f = onYes; cfm.close(); if (f) f(); };
cfm.addEventListener('click', e => { if (e.target === cfm) cfm.close(); });

// Instant UI: apply the change on screen first, then sync in order. One refresh when the queue is empty.
let ops = Promise.resolve(), pendingOps = 0, tmpN = 0;
function applyLocal(p) {
  if (p.action === 'disable') rows.push({ id: 'tmp' + (++tmpN), tmp: true, date: p.date, time: p.time, name: '', phone: '', status: 'Disabled' });
  else if (p.action === 'update') {
    const i = rows.findIndex(r => r.id === p.id); if (i < 0) return;
    if (p.status === 'Cancelled') rows.splice(i, 1); else rows[i] = { ...rows[i], status: p.status };
  }
}
function act(payload, okMsg) {
  applyLocal(payload); render();
  pendingOps++; document.body.classList.add('syncing');
  ops = ops.then(async () => {
    try {
      const r = await api(payload);
      if (!r.ok) throw new Error(r.error);
      toast(okMsg);
    } catch (e) {
      if (expired(e)) { logout(); return; }
      toast(e.message || 'Error');
    } finally {
      if (--pendingOps === 0) {
        document.body.classList.remove('syncing');
        try { await load(); } catch (e2) { if (expired(e2)) logout(); }
      }
    }
  });
  return ops;
}

/* ---- session ---- */
function showApp() { $('#loginPage').hidden = true; $('#app').hidden = false; applyPage(); if (location.hash !== '#setting') loadSettings(); }
function logout() { sessionStorage.removeItem('adminTok'); token = ''; location.reload(); }

async function signIn(pw) {
  const r = await api({ action: 'login', password: pw });
  if (!r.ok) throw new Error(r.error);
  token = r.token;
  await load();
  sessionStorage.setItem('adminTok', token);
  showApp();
}

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw'), btn = $('#lbtn');
  $('#lerr').textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  try { await signIn(pw.value); }
  catch (err) { $('#lerr').textContent = err.message || 'Login failed.'; token = ''; }
  finally { pw.value = ''; btn.disabled = false; btn.textContent = 'Sign in'; }
});
$('#prev').onclick = () => { weekStart = addDays(weekStart, -7); safeLoad(); };
$('#next').onclick = () => { weekStart = addDays(weekStart, 7); safeLoad(); };
$('#todayBtn').onclick = () => { weekStart = ''; selDay = ''; safeLoad(); };
$('#logout').onclick = logout;
mq.addEventListener('change', () => { if (cfg) render(); });

if (!API_URL || API_URL.startsWith('PASTE')) {
  $('#lerr').textContent = 'Set API_URL in config.js first.';
} else {
  const saved = sessionStorage.getItem('adminTok');
  if (saved) {
    token = saved;
    load().then(showApp).catch(() => { sessionStorage.removeItem('adminTok'); token = ''; });
  }
}
setInterval(() => { if (!$('#app').hidden && !document.body.classList.contains('busy') && !cfm.open && !rec.open && !pendingOps && !document.hidden && location.hash !== '#setting') safeLoad(); }, 30000);
</script>
