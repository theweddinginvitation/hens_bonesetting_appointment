<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Hen's Bone Setting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0b3558; --muted:#5b6f86; --line:#e3e7ec;
    --blue:#006bff; --blue-deep:#0052cc; --blue-soft:#eaf2ff;
    --ok:#17a05d;
    --paper:#f7f8fa; --surface:#fff; --chip:#f1f3f6;
    --ring:0 0 0 1px rgba(34,42,53,.08);
    --lift:0 4px 14px rgba(71,103,136,.16);
    --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:var(--body); background:var(--paper); color:var(--ink); line-height:1.45; }
  body.busy { cursor:progress; }
  body.busy button { pointer-events:none; opacity:.6; }
  button, input { font:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid #3b82f6; outline-offset:2px; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 16px; }

  /* login */
  .login-page { min-height:100vh; background:var(--paper); display:grid; place-items:center; padding:20px; }
  .login { width:min(380px,100%); background:var(--surface); border-radius:16px; padding:28px 24px 24px; box-shadow:var(--ring), 0 12px 40px rgba(71,103,136,.16); }
  .login .brand { margin:0 0 2px; font-weight:600; font-size:14px; color:var(--muted); }
  .login h1 { margin:0 0 18px; font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.03em; }
  label { display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
  .login input { width:100%; padding:14px; border:1px solid #cdd5de; border-radius:10px; font-size:16px; background:#fff; color:var(--ink); }
  .login input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-soft); }
  #lerr { color:#b42318; font-size:13.5px; min-height:20px; margin:8px 0 0; }
  .btn { border:0; border-radius:10px; padding:13px 20px; font-weight:600; font-size:16px; }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.primary:hover { background:var(--blue-deep); }
  .btn.ghost { background:var(--chip); color:var(--ink); }
  .btn.ghost:hover { background:#e6eaef; }
  .login .btn { width:100%; margin-top:8px; }

  /* header */
  .hero { background:var(--surface); color:var(--ink); padding:18px 0 14px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .top b { font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .top b small { font-weight:600; font-size:12px; background:var(--blue-soft); color:var(--blue); padding:3px 9px; border-radius:20px; margin-left:8px; vertical-align:1px; }
  .pill { border:0; border-radius:10px; padding:8px 14px; background:var(--chip); color:var(--ink); font-weight:600; font-size:14px; }
  .pill:hover { background:#e6eaef; }
  .row2 { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; justify-content:space-between; }
  .row2 h1 { margin:0; font-family:var(--display); font-weight:800; font-size:clamp(24px,5vw,32px); line-height:1.1; letter-spacing:-.03em; }
  .nav { display:flex; align-items:center; gap:8px; }
  #range { font-weight:600; font-size:14px; min-width:150px; text-align:center; color:var(--muted); }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { display:inline-flex; align-items:center; gap:7px; background:var(--chip); color:var(--ink); border:0; border-radius:10px; padding:7px 12px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .chip:hover { background:#e6eaef; }
  .chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .chip .c-p { background:#f5b400; } .chip .c-a { background:var(--ok); } .chip .c-b { background:#98a4b3; }
  .chip b { font-family:var(--display); font-size:16px; }

  /* day tabs (small screens) */
  #tabs { display:flex; gap:8px; overflow-x:auto; padding:8px 6px 8px; margin:10px -6px 0; scroll-padding-inline:6px; scrollbar-width:none; scroll-snap-type:x proximity; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 66px; scroll-snap-align:start; border:0; border-radius:12px; padding:9px 4px; background:var(--chip); color:var(--ink); text-align:center; position:relative; transition:transform .15s, box-shadow .15s; }
  .tab .dn { display:block; font-size:11.5px; font-weight:600; color:var(--muted); }
  .tab .dd { display:block; font-family:var(--display); font-weight:700; font-size:22px; line-height:1.1; margin-top:1px; letter-spacing:-.02em; }
  .tab[aria-pressed="true"] { background:#fff; box-shadow:0 0 0 2px var(--blue); transform:translateY(-2px); }
  .tab .np { position:absolute; top:-6px; right:-3px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:#f5b400; color:#3d2a00; font-size:12px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 2px #fff; }

  /* week grid (wide screens) */
  main.wrap { padding-top:22px; padding-bottom:16px; }
  .foot { background:var(--ink); color:#cbd7e5; text-align:center; font-size:13.5px; font-weight:500; padding:20px 16px; }
  #grid { display:grid; grid-template-columns:62px repeat(7,minmax(150px,1fr)); gap:8px; }
  .dh { padding:8px 6px; text-align:center; border-radius:10px; background:var(--surface); box-shadow:var(--ring); display:flex; flex-direction:column; }
  .dh b { font-family:var(--display); font-size:15px; letter-spacing:-.01em; }
  .dh span { font-size:12.5px; color:var(--muted); }
  .dh.today { background:var(--blue); color:#fff; box-shadow:none; }
  .dh.today span { color:#d6e6ff; }
  .tl { font-weight:600; font-size:13px; color:var(--muted); padding:12px 4px 0 0; text-align:right; }

  /* list (small screens) */
  #list { display:none; }
  .lrow { display:grid; grid-template-columns:54px 1fr; gap:8px; margin-bottom:8px; }

  /* cells + cards */
  .cell { min-height:96px; }
  .cell.past { opacity:.55; }
  .empty { width:100%; height:100%; min-height:96px; border:1.5px dashed #cdd5de; border-radius:12px; background:transparent; color:var(--muted); font-size:13px; font-weight:600; }
  .empty:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-soft); }
  .empty:disabled, .empty:disabled:hover { cursor:not-allowed; border-color:#cdd5de; color:var(--muted); background:transparent; }
  .card.cardbtn { display:block; width:100%; text-align:left; font:inherit; color:var(--ink); border:0; border-left:4px solid #98a4b3; cursor:pointer; }
  .card.cardbtn:hover { background:#e3e7ec; }
  .card.cardbtn:disabled { cursor:not-allowed; }
  .hint { font-size:12.5px; font-weight:600; color:var(--muted); margin-top:4px; }
  .acts button:disabled { cursor:not-allowed; opacity:.5; }
  .card { border-radius:12px; padding:10px 12px 11px; border-left:4px solid; background:var(--surface); box-shadow:var(--ring); height:100%; }
  .card.Pending { border-color:#f5b400; background:#fff7dd; }
  .card.Approved { border-color:var(--ok); background:#e7f6ee; }
  .card.Disabled { border-color:#98a4b3; background:#eef0f3; }
  .card .nm { font-weight:700; word-break:break-word; }
  .card .nm.none { color:var(--muted); font-style:italic; font-weight:600; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:5px; }
  .meta a { font-size:13px; font-weight:600; color:var(--blue); text-decoration:none; background:rgba(255,255,255,.8); border-radius:8px; padding:3px 8px; }
  .meta a:hover { background:#fff; text-decoration:underline; }
  .badge { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:20px; background:rgba(11,53,88,.08); }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .acts button { border:0; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; }
  .b-ap { background:var(--ok); color:#fff; } .b-ap:hover { background:#0f8449; }
  .b-ca { background:#fff; color:var(--ink); box-shadow:var(--ring); } .b-ca:hover { background:#f1f3f6; }
  .b-di { background:#fde8ea; color:#b42318; } .b-di:hover { background:#fbd5d9; }

  @media (max-width:899px) {
    #grid { display:none; }
    #list { display:block; }
    .row2 h1 { width:100%; }
  }
  @media (min-width:900px) {
    #tabs { display:none; }
    main { overflow-x:auto; }
    #grid { min-width:1130px; }
  }

  /* dialog + toast */
  dialog { border:0; padding:0; border-radius:16px; width:min(400px,calc(100% - 32px)); background:var(--surface); color:var(--ink); box-shadow:0 24px 60px rgba(11,53,88,.28); }
  dialog[open] { animation:pop .22s cubic-bezier(.2,.9,.3,1.2); }
  dialog::backdrop { background:rgba(11,53,88,.45); backdrop-filter:blur(3px); }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(8px); } }
  .cbox { padding:24px 22px 22px; }
  .cbox h2 { margin:0 0 8px; font-family:var(--display); font-size:22px; letter-spacing:-.02em; }
  .cbox p { margin:0 0 20px; color:var(--muted); }
  .cbtns { display:flex; gap:10px; }
  .cbtns .btn { flex:1; padding:13px 10px; }
  .cbox p.sub { margin:0 0 10px; font-size:13.5px; }
  .rlist { max-height:50vh; overflow:auto; margin:0 -6px 16px; padding:0 6px 2px; }
  .rrow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px; border-top:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .rrow:hover { background:var(--paper); }
  .rrow .when { font-size:12.5px; font-weight:600; color:var(--muted); }
  .rrow .who { font-weight:700; word-break:break-word; }
  .rrow .ph { font-size:13px; color:var(--muted); }
  .rrow button { border:0; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; background:var(--ok); color:#fff; flex:none; }
  .rempty { padding:14px 12px; color:var(--muted); border-top:1px solid var(--line); }
  .btn.danger { background:#d92d20; color:#fff; } .btn.danger:hover { background:#b42318; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s; z-index:20; max-width:calc(100% - 32px); }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <form id="login" class="login">
    <p class="brand">Hen's Bone Setting</p>
    <h1>Admin</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p id="lerr" role="alert"></p>
    <button type="submit" class="btn primary" id="lbtn">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <b>Hen's Bone Setting <small>Admin</small></b>
        <button class="pill" id="logout" type="button">Log out</button>
      </div>
      <div class="row2">
        <h1>Appointments</h1>
        <div class="nav">
          <button class="pill" id="prev" type="button" aria-label="Previous week">‹</button>
          <span id="range"></span>
          <button class="pill" id="next" type="button" aria-label="Next week">›</button>
          <button class="pill" id="todayBtn" type="button">Today</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div id="tabs" role="group" aria-label="Choose day"></div>
    </div>
  </header>
  <main class="wrap">
    <div id="grid"></div>
    <div id="list"></div>
  </main>
  <footer class="foot">Hen's Bone Setting</footer>
</div>

<dialog id="rec" aria-labelledby="rTitle">
  <div class="cbox">
    <h2 id="rTitle"></h2>
    <p class="sub" id="rSub"></p>
    <div class="rlist" id="rList"></div>
    <div class="cbtns"><button type="button" class="btn ghost" id="rClose" autofocus>Close</button></div>
  </div>
</dialog>

<dialog id="cfm" aria-labelledby="cTitle">
  <div class="cbox">
    <h2 id="cTitle">Cancel appointment?</h2>
    <p id="cMsg"></p>
    <div class="cbtns">
      <button type="button" class="btn ghost" id="cNo">Keep it</button>
      <button type="button" class="btn danger" id="cYes">Cancel it</button>
    </div>
  </div>
</dialog>
<div id="toast"></div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const mq = window.matchMedia('(min-width:900px)');
let token = '', cfg = null, weekStart = '', rows = [], selDay = '';

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  kids.flat().filter(Boolean).forEach(c => e.append(c));
  return e;
}
function parts(ymd) { return ymd.split('-').map(Number); }
function addDays(ymd, n) { const [y, m, d] = parts(ymd); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function localDate(ymd) { const [y, m, d] = parts(ymd); return new Date(y, m - 1, d); }
function md(ymd) { return localDate(ymd).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function dow(ymd) { return localDate(ymd).toLocaleDateString('en-US', { weekday: 'short' }); }
function longDate(ymd) { return localDate(ymd).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); }
function waLink(phone) {
  let d = String(phone).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '62' + d.slice(1);
  return 'https://wa.me/' + d;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ---- api: password is sent only by login(); afterwards a short-lived token is used ---- */
async function api(body) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, token })
  });
  return r.json();
}
function expired(e) { return /session|password/i.test((e && e.message) || ''); }

async function load() {
  const r = await api({ action: 'admin_list', from: weekStart });
  if (!r.ok) throw new Error(r.error);
  cfg = r.config; weekStart = r.from; rows = r.rows;
  const week = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  if (!week.includes(selDay)) selDay = week.includes(cfg.today) ? cfg.today : weekStart;
  render();
}
function safeLoad() {
  return load().catch(e => { if (expired(e)) logout(); else toast(e.message || 'Error'); });
}

/* ---- render ---- */
function render() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  $('#range').textContent = md(weekStart) + ' – ' + md(days[6]) + ', ' + localDate(days[6]).getFullYear();

  const count = s => rows.filter(r => r.status === s).length;
  const st = $('#stats'); st.replaceChildren(
    h('button', { class: 'chip', type: 'button', onclick: () => showRecords('Pending') }, h('i', { class: 'c-p' }), h('b', { text: count('Pending') }), 'pending'),
    h('button', { class: 'chip', type: 'button', onclick: () => showRecords('Approved') }, h('i', { class: 'c-a' }), h('b', { text: count('Approved') }), 'approved'));

  const byKey = new Map(rows.map(r => [r.date + ' ' + r.time, r]));

  const tabs = $('#tabs'); tabs.replaceChildren();
  days.forEach(d => {
    const np = rows.filter(r => r.date === d && r.status === 'Pending').length;
    const b = h('button', { class: 'tab', type: 'button', onclick: () => { selDay = d; render(); } },
      h('span', { class: 'dn', text: d === cfg.today ? 'Today' : dow(d) }),
      h('span', { class: 'dd', text: localDate(d).getDate() }),
      np ? h('span', { class: 'np', text: np }) : null);
    b.setAttribute('aria-pressed', d === selDay);
    tabs.append(b);
  });

  const g = $('#grid'); g.replaceChildren();
  const list = $('#list'); list.replaceChildren();
  if (mq.matches) {
    g.append(h('div'));
    days.forEach(d => g.append(h('div', { class: 'dh' + (d === cfg.today ? ' today' : '') },
      h('b', { text: dow(d) }), h('span', { text: md(d) }))));
    cfg.times.forEach(t => {
      g.append(h('div', { class: 'tl', text: t }));
      days.forEach(d => g.append(cell(d, t, byKey.get(d + ' ' + t))));
    });
  } else {
    list.append(h('p', { text: longDate(selDay), style: 'margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:20px;' }));
    cfg.times.forEach(t => list.append(h('div', { class: 'lrow' },
      h('div', { class: 'tl', text: t }), cell(selDay, t, byKey.get(selDay + ' ' + t)))));
  }
}

function cell(d, t, r) {
  const past = (d + ' ' + t) <= cfg.now;
  const c = h('div', { class: 'cell' + (past ? ' past' : '') });
  if (!r) {
    c.append(h('button', { class: 'empty', type: 'button', text: 'Click to Block', disabled: past,
      onclick: () => act({ action: 'disable', date: d, time: t }, 'Slot blocked.') }));
    return c;
  }
  const named = !!r.name;
  if (!named) { // blocked slot: the whole card is the unblock button
    c.append(h('button', { class: 'card Disabled cardbtn', type: 'button', disabled: past,
      onclick: () => act({ action: 'update', id: r.id, status: 'Cancelled' }, 'Slot unblocked.') },
      h('div', { class: 'nm none', text: 'Blocked' }),
      h('div', { class: 'hint', text: 'Click to Unblock' })));
    return c;
  }
  const acts = h('div', { class: 'acts' });
  if (r.status !== 'Approved') acts.append(h('button', { class: 'b-ap', type: 'button', text: 'Approve', disabled: past,
    onclick: () => act({ action: 'update', id: r.id, status: 'Approved' }, 'Approved.') }));
  acts.append(h('button', { class: 'b-ca', type: 'button', text: 'Cancel', disabled: past,
    onclick: () => confirmBox('Cancel appointment?', r.name + ' · ' + longDate(d) + ', ' + t + '. The slot becomes available again.',
      () => act({ action: 'update', id: r.id, status: 'Cancelled' }, 'Slot available again.')) }));
  const meta = h('div', { class: 'meta' },
    r.phone ? h('a', { href: 'tel:' + r.phone, text: r.phone }) : null,
    r.phone ? h('a', { href: waLink(r.phone), target: '_blank', rel: 'noopener', text: 'WhatsApp' }) : null,
    h('span', { class: 'badge', text: r.status }));
  c.append(h('div', { class: 'card ' + r.status },
    h('div', { class: 'nm', text: r.name }),
    meta, acts));
  return c;
}

/* ---- records dialog (tap a counter) ---- */
const rec = $('#rec');
function showRecords(status) {
  const list = rows.filter(r => r.status === status && r.name)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  $('#rTitle').textContent = (status === 'Pending' ? 'Pending' : 'Approved') + ' (' + list.length + ')';
  $('#rSub').textContent = md(weekStart) + ' – ' + md(addDays(weekStart, 6)) + ' · tap a record to jump to it';
  const box = $('#rList'); box.replaceChildren();
  if (!list.length) box.append(h('div', { class: 'rempty', text: 'No ' + status.toLowerCase() + ' appointments in this range.' }));
  list.forEach(r => {
    const past = (r.date + ' ' + r.time) <= cfg.now;
    const row = h('div', { class: 'rrow', onclick: () => { selDay = r.date; rec.close(); render(); } },
      h('div', null,
        h('div', { class: 'when', text: dow(r.date) + ', ' + md(r.date) + ' · ' + r.time }),
        h('div', { class: 'who', text: r.name }),
        h('div', { class: 'ph', text: r.phone })));
    if (status === 'Pending' && !past) row.append(h('button', { type: 'button', text: 'Approve',
      onclick: e => { e.stopPropagation(); rec.close(); act({ action: 'update', id: r.id, status: 'Approved' }, 'Approved.'); } }));
    box.append(row);
  });
  rec.showModal();
}
$('#rClose').onclick = () => rec.close();
rec.addEventListener('click', e => { if (e.target === rec) rec.close(); });

/* ---- confirm dialog ---- */
const cfm = $('#cfm');
let onYes = null;
function confirmBox(title, msg, yes) {
  $('#cTitle').textContent = title; $('#cMsg').textContent = msg; onYes = yes; cfm.showModal();
}
$('#cNo').onclick = () => cfm.close();
$('#cYes').onclick = () => { const f = onYes; cfm.close(); if (f) f(); };
cfm.addEventListener('click', e => { if (e.target === cfm) cfm.close(); });

async function act(payload, okMsg) {
  document.body.classList.add('busy');
  try {
    const r = await api(payload);
    if (!r.ok) throw new Error(r.error);
    await load();
    toast(okMsg);
  } catch (e) {
    if (expired(e)) { logout(); return; }
    toast(e.message || 'Error'); try { await load(); } catch (_) {}
  } finally {
    document.body.classList.remove('busy');
  }
}

/* ---- session ---- */
function showApp() { $('#loginPage').hidden = true; $('#app').hidden = false; }
function logout() { sessionStorage.removeItem('adminTok'); token = ''; location.reload(); }

async function signIn(pw) {
  const r = await api({ action: 'login', password: pw });
  if (!r.ok) throw new Error(r.error);
  token = r.token;
  await load();
  sessionStorage.setItem('adminTok', token);
  showApp();
}

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw'), btn = $('#lbtn');
  $('#lerr').textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  try { await signIn(pw.value); }
  catch (err) { $('#lerr').textContent = err.message || 'Login failed.'; token = ''; }
  finally { pw.value = ''; btn.disabled = false; btn.textContent = 'Sign in'; }
});
$('#prev').onclick = () => { weekStart = addDays(weekStart, -7); safeLoad(); };
$('#next').onclick = () => { weekStart = addDays(weekStart, 7); safeLoad(); };
$('#todayBtn').onclick = () => { weekStart = ''; selDay = ''; safeLoad(); };
$('#logout').onclick = logout;
mq.addEventListener('change', () => { if (cfg) render(); });

if (!API_URL || API_URL.startsWith('PASTE')) {
  $('#lerr').textContent = 'Set API_URL in config.js first.';
} else {
  const saved = sessionStorage.getItem('adminTok');
  if (saved) {
    token = saved;
    load().then(showApp).catch(() => { sessionStorage.removeItem('adminTok'); token = ''; });
  }
}
setInterval(() => { if (!$('#app').hidden && !document.body.classList.contains('busy') && !cfm.open && !rec.open) safeLoad(); }, 30000);
</script>
</body>
